<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b152d"/>
      <stop offset="100%" stop-color="#162a54"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="460" rx="20" fill="url(#bgGrad)"/>

  <!-- Title & Subtitle -->
  <text x="460" y="42" font-family="'Outfit', sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">SO SÁNH TRỰC QUAN: BEFORE VS AFTER TỜ THÔNG BÁO SỰ KIỆN</text>
  <text x="460" y="68" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#93c5fd" text-anchor="middle">Từ văn bản thô lệch lề, không đầu cuối ➔ Văn bản A4 hai cột, Header &amp; Footer chuẩn mực</text>

  <!-- Main Container Card -->
  <g transform="translate(40, 88)" filter="url(#shadow)">
    <rect width="840" height="344" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- BEFORE COLUMN (LEFT) -->
    <g transform="translate(35, 20)">
      <!-- Red Badge -->
      <rect x="0" y="0" width="365" height="30" rx="8" fill="#ffe4e6" stroke="#f43f5e" stroke-width="1.2"/>
      <text x="182" y="19" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" fill="#be123c" text-anchor="middle">❌ BEFORE: CHƯA THIẾT LẬP TRANG &amp; BỐ CỤC</text>

      <!-- Simulated Sheet (Before) -->
      <g transform="translate(30, 42)">
        <rect x="0" y="0" width="305" height="235" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
        
        <!-- Text squished into corner, wrong margin -->
        <g transform="translate(10, 10)">
          <text x="5" y="14" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#94a3b8">THÔNG BÁO NGÀY HỘI THỂ THAO</text>
          <text x="5" y="28" font-family="'Inter', sans-serif" font-size="8.5" font-weight="400" fill="#94a3b8">(Khổ Letter mặc định, lề quá sát mép, không Header)</text>
          
          <!-- Long repetitive single-column text -->
          <rect x="5" y="38" width="280" height="5" rx="1" fill="#cbd5e1"/>
          <rect x="5" y="47" width="275" height="5" rx="1" fill="#cbd5e1"/>
          <rect x="5" y="56" width="260" height="5" rx="1" fill="#cbd5e1"/>
          <rect x="5" y="65" width="270" height="5" rx="1" fill="#cbd5e1"/>
          <rect x="5" y="74" width="250" height="5" rx="1" fill="#cbd5e1"/>
          <rect x="5" y="83" width="280" height="5" rx="1" fill="#cbd5e1"/>
          <rect x="5" y="92" width="240" height="5" rx="1" fill="#cbd5e1"/>
          <rect x="5" y="101" width="265" height="5" rx="1" fill="#cbd5e1"/>
          <rect x="5" y="110" width="275" height="5" rx="1" fill="#cbd5e1"/>
          <rect x="5" y="119" width="230" height="5" rx="1" fill="#cbd5e1"/>
          <rect x="5" y="128" width="280" height="5" rx="1" fill="#cbd5e1"/>
          <rect x="5" y="137" width="260" height="5" rx="1" fill="#cbd5e1"/>
          <rect x="5" y="146" width="250" height="5" rx="1" fill="#cbd5e1"/>
          <rect x="5" y="155" width="270" height="5" rx="1" fill="#cbd5e1"/>
          
          <!-- Manual typed page number "1" -->
          <text x="5" y="195" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#ef4444">1 (Gõ tay thủ công dưới thân bài)</text>
        </g>
      </g>

      <text x="182" y="300" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#e11d48" text-anchor="middle">Lỗi: Đơn điệu, không chia cột, khó đọc lướt, in ra bị cắt mép</text>
    </g>

    <!-- AFTER COLUMN (RIGHT) -->
    <g transform="translate(440, 20)">
      <!-- Green Badge -->
      <rect x="0" y="0" width="365" height="30" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.2"/>
      <text x="182" y="19" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" fill="#065f46" text-anchor="middle">✓ AFTER: CHUẨN GOOGLE DOCS THCS ĐẲNG CẤP</text>

      <!-- Simulated Sheet (After) -->
      <g transform="translate(30, 42)">
        <rect x="0" y="0" width="305" height="235" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
        
        <!-- Header Region -->
        <rect x="15" y="8" width="275" height="22" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
        <text x="22" y="21" font-family="'Inter', sans-serif" font-size="7.5" font-weight="800" fill="#1e40af">TRƯỜNG THCS NGUYỄN DU</text>
        <text x="282" y="21" font-family="'Inter', sans-serif" font-size="7" font-weight="600" fill="#2563eb" text-anchor="end">NGÀY HỘI OLYMPIC THỂ THAO 2026</text>

        <!-- Document Title -->
        <rect x="15" y="36" width="275" height="18" rx="4" fill="#0f172a"/>
        <text x="152" y="48" font-family="'Outfit', sans-serif" font-size="9" font-weight="900" fill="#f8fafc" text-anchor="middle">THÔNG BÁO KHỞI TRANH NGÀY HỘI THỂ THAO</text>

        <!-- 2 Columns Layout -->
        <g transform="translate(15, 60)">
          <!-- Col 1 -->
          <rect x="0" y="0" width="130" height="122" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
          <text x="6" y="14" font-family="'Inter', sans-serif" font-size="7.5" font-weight="800" fill="#0d9488">1. LỊCH THI ĐẤU</text>
          <rect x="6" y="20" width="118" height="4" rx="1" fill="#64748b"/>
          <rect x="6" y="27" width="110" height="4" rx="1" fill="#64748b"/>
          <rect x="6" y="34" width="115" height="4" rx="1" fill="#64748b"/>
          
          <!-- Mini Event Badge -->
          <rect x="6" y="44" width="118" height="26" rx="3" fill="#eff6ff"/>
          <text x="10" y="56" font-family="'Inter', sans-serif" font-size="7" font-weight="700" fill="#1d4ed8">⚽ Bóng đá mini: 08:00</text>
          <text x="10" y="66" font-family="'Inter', sans-serif" font-size="7" font-weight="700" fill="#1d4ed8">🏀 Bóng rổ 3x3: 09:30</text>

          <rect x="6" y="76" width="118" height="4" rx="1" fill="#64748b"/>
          <rect x="6" y="83" width="105" height="4" rx="1" fill="#64748b"/>
          <rect x="6" y="90" width="90" height="4" rx="1" fill="#64748b"/>

          <!-- Divider line -->
          <line x1="137" y1="2" x2="137" y2="120" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2"/>

          <!-- Col 2 -->
          <rect x="145" y="0" width="130" height="122" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
          <text x="151" y="14" font-family="'Inter', sans-serif" font-size="7.5" font-weight="800" fill="#7c3aed">2. ĐIỀU LỆ &amp; THƯỞNG</text>
          <rect x="151" y="20" width="118" height="4" rx="1" fill="#64748b"/>
          <rect x="151" y="27" width="110" height="4" rx="1" fill="#64748b"/>
          
          <rect x="151" y="38" width="118" height="34" rx="3" fill="#fef3c7"/>
          <text x="155" y="50" font-family="'Inter', sans-serif" font-size="7" font-weight="800" fill="#b45309">🏆 01 Giải Nhất: Cúp Vàng</text>
          <text x="155" y="60" font-family="'Inter', sans-serif" font-size="6.8" font-weight="600" fill="#92400e">🥈 02 Giải Nhì: Huy chương Bạc</text>
          <text x="155" y="68" font-family="'Inter', sans-serif" font-size="6.8" font-weight="600" fill="#92400e">🥉 03 Giải Ba: Cờ lưu niệm</text>

          <rect x="151" y="80" width="118" height="4" rx="1" fill="#64748b"/>
          <rect x="151" y="87" width="105" height="4" rx="1" fill="#64748b"/>
          <rect x="151" y="94" width="80" height="4" rx="1" fill="#64748b"/>
        </g>

        <!-- Footer Region -->
        <rect x="15" y="195" width="275" height="22" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
        <text x="22" y="208" font-family="'Inter', sans-serif" font-size="7" font-weight="600" fill="#15803d">Ban Tổ Chức Thể Dục Thể Thao THCS</text>
        <text x="282" y="208" font-family="'Inter', sans-serif" font-size="7.5" font-weight="800" fill="#047857" text-anchor="end">Trang 1 / 2</text>
      </g>

      <text x="182" y="300" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" fill="#047857" text-anchor="middle">Chuẩn mực: Khổ A4, lề 2-2-3-2cm, Header trường học, 2 cột báo chí, số trang tự động</text>
    </g>
  </g>
</svg>

