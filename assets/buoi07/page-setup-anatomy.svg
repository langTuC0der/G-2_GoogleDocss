<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b152d"/>
      <stop offset="100%" stop-color="#162a54"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="460" rx="20" fill="url(#bgGrad)"/>

  <!-- Title & Subtitle -->
  <text x="460" y="42" font-family="'Outfit', sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">GIẢI PHẪU THIẾT LẬP TRANG (PAGE SETUP) TRONG GOOGLE DOCS</text>
  <text x="460" y="68" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#93c5fd" text-anchor="middle">Quy chuẩn khổ A4 (210×297mm) · 4 Chiều căn lề Margins · Hướng giấy Portrait &amp; Landscape</text>

  <!-- Main Container Card -->
  <g transform="translate(40, 88)" filter="url(#shadow)">
    <rect width="840" height="344" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Left: Portrait Paper (Khổ Dọc) -->
    <g transform="translate(30, 22)">
      <!-- Outer Page Border (A4 Portrait) -->
      <rect x="0" y="0" width="200" height="280" rx="6" fill="url(#pageGrad)" stroke="#2563eb" stroke-width="2"/>
      
      <!-- Margin Boundaries (Dashed) -->
      <rect x="26" y="24" width="154" height="232" rx="3" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3"/>
      
      <!-- Content Lines Representation -->
      <rect x="36" y="38" width="134" height="8" rx="2" fill="#93c5fd"/>
      <rect x="36" y="52" width="110" height="6" rx="2" fill="#cbd5e1"/>
      <rect x="36" y="64" width="128" height="6" rx="2" fill="#cbd5e1"/>
      <rect x="36" y="76" width="120" height="6" rx="2" fill="#cbd5e1"/>
      <rect x="36" y="88" width="80" height="6" rx="2" fill="#cbd5e1"/>

      <!-- Margins Labels & Dimension Arrows -->
      <!-- Top Margin -->
      <line x1="103" y1="0" x2="103" y2="24" stroke="#ef4444" stroke-width="1.8"/>
      <text x="108" y="15" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#dc2626">Top: 2.0cm</text>
      <!-- Bottom Margin -->
      <line x1="103" y1="256" x2="103" y2="280" stroke="#ef4444" stroke-width="1.8"/>
      <text x="108" y="272" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#dc2626">Bottom: 2.0cm</text>
      <!-- Left Margin (Lề đóng gáy sách thường rộng hơn: 3cm) -->
      <line x1="0" y1="140" x2="26" y2="140" stroke="#ef4444" stroke-width="1.8"/>
      <text x="13" y="132" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#dc2626" text-anchor="middle">Left: 3cm</text>
      <!-- Right Margin -->
      <line x1="180" y1="140" x2="200" y2="140" stroke="#ef4444" stroke-width="1.8"/>
      <text x="190" y="132" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#dc2626" text-anchor="middle">Right: 2cm</text>

      <!-- Center Badge -->
      <rect x="42" y="150" width="120" height="32" rx="8" fill="#2563eb"/>
      <text x="102" y="166" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">PORTRAIT (DỌC)</text>
      <text x="102" y="177" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" fill="#dbeafe" text-anchor="middle">Khổ A4: 210 × 297 mm</text>

      <!-- Caption below -->
      <text x="100" y="296" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#1e293b" text-anchor="middle">Văn bản chuẩn, báo cáo, bài luận</text>
    </g>

    <!-- Center: Landscape Paper (Khổ Ngang) -->
    <g transform="translate(265, 50)">
      <!-- Outer Page Border (A4 Landscape) -->
      <rect x="0" y="0" width="280" height="195" rx="6" fill="url(#pageGrad)" stroke="#0d9488" stroke-width="2"/>
      
      <!-- Margin Boundaries -->
      <rect x="22" y="20" width="236" height="155" rx="3" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5" stroke-dasharray="4 3"/>

      <!-- 3 Columns inside Landscape -->
      <rect x="32" y="32" width="66" height="50" rx="3" fill="#ccfbf1"/>
      <rect x="107" y="32" width="66" height="50" rx="3" fill="#ccfbf1"/>
      <rect x="182" y="32" width="66" height="50" rx="3" fill="#ccfbf1"/>

      <!-- Center Badge -->
      <rect x="75" y="100" width="130" height="32" rx="8" fill="#0d9488"/>
      <text x="140" y="116" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">LANDSCAPE (NGANG)</text>
      <text x="140" y="127" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" fill="#ccfbf1" text-anchor="middle">Khổ A4: 297 × 210 mm</text>

      <!-- Dimension Labels -->
      <text x="140" y="15" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#0f766e" text-anchor="middle">Chiều ngang mở rộng 297 mm</text>
      <text x="140" y="215" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#1e293b" text-anchor="middle">Thời khóa biểu nhiều cột, Bảng số liệu, Poster</text>
    </g>

    <!-- Right: Crucial Settings Checklist Card -->
    <g transform="translate(575, 20)">
      <rect width="235" height="285" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      
      <rect x="14" y="14" width="207" height="30" rx="6" fill="#1e293b"/>
      <text x="117" y="34" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">⚙️ THỰC HÀNH PAGE SETUP</text>

      <g transform="translate(16, 56)">
        <!-- Step 1 -->
        <circle cx="10" cy="12" r="9" fill="#2563eb"/>
        <text x="10" y="16" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
        <text x="26" y="12" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#0f172a">Đường dẫn mở bảng</text>
        <text x="26" y="26" font-family="'Inter', sans-serif" font-size="9.5" font-weight="500" fill="#64748b">Tệp (File) ➔ Thiết lập trang</text>

        <!-- Step 2 -->
        <circle cx="10" cy="50" r="9" fill="#2563eb"/>
        <text x="10" y="54" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
        <text x="26" y="50" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#0f172a">Đổi sang khổ giấy A4</text>
        <text x="26" y="64" font-family="'Inter', sans-serif" font-size="9.5" font-weight="500" fill="#dc2626">Mặc định là Letter (US) ⚠️</text>

        <!-- Step 3 -->
        <circle cx="10" cy="88" r="9" fill="#2563eb"/>
        <text x="10" y="92" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
        <text x="26" y="88" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#0f172a">Căn 4 lề trang (Margins)</text>
        <text x="26" y="102" font-family="'Inter', sans-serif" font-size="9.5" font-weight="500" fill="#64748b">Chuẩn: 2cm - 2cm - 3cm - 2cm</text>

        <!-- Step 4 -->
        <circle cx="10" cy="126" r="9" fill="#2563eb"/>
        <text x="10" y="130" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>
        <text x="26" y="126" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#0f172a">Đặt làm mặc định</text>
        <text x="26" y="140" font-family="'Inter', sans-serif" font-size="9.5" font-weight="500" fill="#64748b">Nút "Set as default" tiện lợi</text>
      </g>

      <!-- Pro tip pill at bottom -->
      <rect x="14" y="218" width="207" height="52" rx="8" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
      <text x="22" y="235" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#b45309">💡 LƯU Ý QUAN TRỌNG:</text>
      <text x="22" y="250" font-family="'Inter', sans-serif" font-size="8.5" font-weight="500" fill="#92400e">Google Docs hiện nay hỗ trợ</text>
      <text x="22" y="261" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" fill="#92400e">chế độ Không phân trang (Pageless)!</text>
    </g>
  </g>
</svg>

