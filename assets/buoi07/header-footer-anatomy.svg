<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b152d"/>
      <stop offset="100%" stop-color="#162a54"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="footerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="460" rx="20" fill="url(#bgGrad)"/>

  <!-- Title & Subtitle -->
  <text x="460" y="42" font-family="'Outfit', sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">GIẢI PHẪU HEADER &amp; FOOTER (ĐẦU TRANG &amp; CHÂN TRANG)</text>
  <text x="460" y="68" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#93c5fd" text-anchor="middle">Lặp lại tự động · Tùy chọn Different First Page (Trang đầu khác biệt) · Đánh số trang thông minh</text>

  <!-- Main Container Card -->
  <g transform="translate(40, 88)" filter="url(#shadow)">
    <rect width="840" height="344" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Left: Page 1 (Cover Page - Trang đầu tiên khác biệt) -->
    <g transform="translate(35, 20)">
      <rect x="0" y="0" width="180" height="255" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      
      <!-- Ghost Header Area (Disabled / Blank) -->
      <rect x="12" y="10" width="156" height="28" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
      <text x="90" y="27" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" fill="#94a3b8" text-anchor="middle">🚫 Không có Header</text>

      <!-- Cover Body Content -->
      <circle cx="90" cy="85" r="22" fill="#dbeafe"/>
      <text x="90" y="91" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">📘</text>
      <rect x="35" y="120" width="110" height="10" rx="3" fill="#1e3a8a"/>
      <rect x="50" y="136" width="80" height="6" rx="2" fill="#64748b"/>
      <rect x="40" y="160" width="100" height="5" rx="2" fill="#cbd5e1"/>
      <rect x="55" y="172" width="70" height="5" rx="2" fill="#cbd5e1"/>

      <!-- Ghost Footer Area (Disabled / Blank) -->
      <rect x="12" y="215" width="156" height="28" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
      <text x="90" y="232" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" fill="#94a3b8" text-anchor="middle">🚫 Không có Số trang</text>

      <text x="90" y="278" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" fill="#1e293b" text-anchor="middle">TRANG 1 (BÌA BÁO CÁO)</text>
      <text x="90" y="293" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#2563eb" text-anchor="middle">✓ Different first page bật</text>
    </g>

    <!-- Center: Page 2 (Nội dung chính với Header & Footer) -->
    <g transform="translate(255, 20)">
      <rect x="0" y="0" width="180" height="255" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
      
      <!-- Active Header -->
      <rect x="12" y="10" width="156" height="30" rx="4" fill="url(#headerGrad)" stroke="#3b82f6" stroke-width="1.2"/>
      <text x="20" y="24" font-family="'Inter', sans-serif" font-size="7.5" font-weight="800" fill="#1e40af">TRƯỜNG THCS NGUYỄN DU</text>
      <text x="160" y="24" font-family="'Inter', sans-serif" font-size="7.5" font-weight="600" fill="#2563eb" text-anchor="end">Tin học 7</text>
      <line x1="20" y1="30" x2="160" y2="30" stroke="#bfdbfe" stroke-width="1"/>

      <!-- Body Content -->
      <g transform="translate(18, 50)">
        <rect x="0" y="0" width="144" height="7" rx="2" fill="#1e293b"/>
        <rect x="0" y="14" width="138" height="5" rx="1.5" fill="#64748b"/>
        <rect x="0" y="24" width="144" height="5" rx="1.5" fill="#64748b"/>
        <rect x="0" y="34" width="120" height="5" rx="1.5" fill="#64748b"/>
        <!-- Table inside page 2 -->
        <rect x="0" y="48" width="144" height="60" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <line x1="0" y1="64" x2="144" y2="64" stroke="#cbd5e1" stroke-width="1"/>
        <line x1="48" y1="48" x2="48" y2="108" stroke="#cbd5e1" stroke-width="1"/>
        <line x1="96" y1="48" x2="96" y2="108" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="0" y="116" width="144" height="5" rx="1.5" fill="#64748b"/>
        <rect x="0" y="126" width="90" height="5" rx="1.5" fill="#64748b"/>
      </g>

      <!-- Active Footer with Page Number -->
      <rect x="12" y="215" width="156" height="30" rx="4" fill="url(#footerGrad)" stroke="#10b981" stroke-width="1.2"/>
      <line x1="20" y1="223" x2="160" y2="223" stroke="#bbf7d0" stroke-width="1"/>
      <text x="20" y="235" font-family="'Inter', sans-serif" font-size="7" font-weight="600" fill="#166534">Dự án Thể Thao Học Đường</text>
      <!-- Page number badge -->
      <rect x="138" y="226" width="22" height="13" rx="3" fill="#10b981"/>
      <text x="149" y="236" font-family="'Inter', sans-serif" font-size="8" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>

      <text x="90" y="278" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" fill="#1e293b" text-anchor="middle">TRANG 2 (NỘI DUNG)</text>
      <text x="90" y="293" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#059669" text-anchor="middle">Header &amp; Số trang hiển thị</text>
    </g>

    <!-- Connector arrow between pages -->
    <path d="M 220 120 L 250 120" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Right: Master Cheatsheet Card -->
    <g transform="translate(475, 18)">
      <rect width="335" height="300" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      
      <rect x="16" y="14" width="303" height="30" rx="6" fill="#0f172a"/>
      <text x="167" y="34" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">⚡ QUY TẮC VÀNG VỀ HEADER &amp; FOOTER</text>

      <!-- Rule 1 -->
      <g transform="translate(18, 54)">
        <rect x="0" y="0" width="300" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="12" y="20" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#2563eb">1. Cách vào chế độ chỉnh sửa</text>
        <text x="12" y="36" font-family="'Inter', sans-serif" font-size="9.5" font-weight="500" fill="#475569">Nhấp đúp chuột (Double click) vào sát mép trên hoặc dưới của trang.</text>
      </g>

      <!-- Rule 2 -->
      <g transform="translate(18, 114)">
        <rect x="0" y="0" width="300" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="12" y="20" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#059669">2. Trang đầu tiên khác biệt</text>
        <text x="12" y="36" font-family="'Inter', sans-serif" font-size="9.5" font-weight="500" fill="#475569">Tích chọn "Different first page" để trang bìa không bị dính Header &amp; Số trang.</text>
      </g>

      <!-- Rule 3 -->
      <g transform="translate(18, 174)">
        <rect x="0" y="0" width="300" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="12" y="20" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#d97706">3. Đánh số trang (Page Numbers)</text>
        <text x="12" y="36" font-family="'Inter', sans-serif" font-size="9.5" font-weight="500" fill="#475569">Chèn (Insert) ➔ Số trang ➔ Chọn mẫu góc dưới bên phải (Bottom Right).</text>
      </g>

      <!-- Warning box -->
      <g transform="translate(18, 234)">
        <rect x="0" y="0" width="300" height="48" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
        <text x="12" y="18" font-family="'Inter', sans-serif" font-size="9.5" font-weight="800" fill="#be123c">⛔ SAI LẦM HỌC SINH HAY MẮC:</text>
        <text x="12" y="34" font-family="'Inter', sans-serif" font-size="8.8" font-weight="600" fill="#9f1239">Gõ tay số "1", "2" vào Header/Footer ➔ Mọi trang đều mang số giống nhau!</text>
      </g>
    </g>
  </g>
</svg>

