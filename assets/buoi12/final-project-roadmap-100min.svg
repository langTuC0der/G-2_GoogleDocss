<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="roadBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="100%" stop-color="#1c1936"/>
    </linearGradient>
    <filter id="roadGlow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#roadBg)"/>

  <!-- Top Title Badge -->
  <rect x="220" y="20" width="520" height="42" rx="21" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="480" y="47" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fbbf24" text-anchor="middle">
    LỘ TRÌNH 100 PHÚT CHINH PHỤC FINAL PROJECT: CẨM NANG THCS
  </text>

  <!-- Winding Timeline Track -->
  <g transform="translate(60, 95)" filter="url(#roadGlow)">
    
    <!-- Stage 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="160" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
      <rect x="14" y="14" width="40" height="40" rx="10" fill="#2563eb"/>
      <text x="34" y="39" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
      <text x="64" y="32" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#60a5fa">0' – 10'</text>
      <text x="64" y="48" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Đề Bài &amp; Tiêu Chí</text>
      <text x="14" y="85" font-family="Arial, sans-serif" font-size="11.5" fill="#cbd5e1">• Công bố đề bài Cẩm nang</text>
      <text x="14" y="105" font-family="Arial, sans-serif" font-size="11.5" fill="#cbd5e1">• Giải thích Rubric 40đ</text>
      <text x="14" y="125" font-family="Arial, sans-serif" font-size="11.5" fill="#cbd5e1">• Kích hoạt tinh thần nhóm</text>
    </g>

    <!-- Connector 1 -->
    <line x1="180" y1="80" x2="220" y2="80" stroke="#60a5fa" stroke-width="3" stroke-dasharray="4,4"/>

    <!-- Stage 2 -->
    <g transform="translate(220, 0)">
      <rect width="180" height="160" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
      <rect x="14" y="14" width="40" height="40" rx="10" fill="#059669"/>
      <text x="34" y="39" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
      <text x="64" y="32" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34d399">10' – 20'</text>
      <text x="64" y="48" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Chia Nhóm &amp; Vai Trò</text>
      <text x="14" y="85" font-family="Arial, sans-serif" font-size="11.5" fill="#cbd5e1">• Bầu nhóm trưởng</text>
      <text x="14" y="105" font-family="Arial, sans-serif" font-size="11.5" fill="#cbd5e1">• Phân công 4 vai trò</text>
      <text x="14" y="125" font-family="Arial, sans-serif" font-size="11.5" fill="#cbd5e1">• Tạo file &amp; phân quyền</text>
    </g>

    <!-- Connector 2 -->
    <line x1="400" y1="80" x2="440" y2="80" stroke="#34d399" stroke-width="3" stroke-dasharray="4,4"/>

    <!-- Stage 3 -->
    <g transform="translate(440, 0)">
      <rect width="180" height="160" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
      <rect x="14" y="14" width="40" height="40" rx="10" fill="#d97706"/>
      <text x="34" y="39" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
      <text x="64" y="32" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24">20' – 30'</text>
      <text x="64" y="48" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Cấu Trúc Tài Liệu</text>
      <text x="14" y="85" font-family="Arial, sans-serif" font-size="11.5" fill="#cbd5e1">• Dựng dàn ý Headings</text>
      <text x="14" y="105" font-family="Arial, sans-serif" font-size="11.5" fill="#cbd5e1">• Khung Trang bìa &amp; Mục lục</text>
      <text x="14" y="125" font-family="Arial, sans-serif" font-size="11.5" fill="#cbd5e1">• Đặt lề trang A4 chuẩn</text>
    </g>

    <!-- Connector 3 -->
    <line x1="620" y1="80" x2="660" y2="80" stroke="#fbbf24" stroke-width="3" stroke-dasharray="4,4"/>

    <!-- Stage 4: CAO ĐIỂM -->
    <g transform="translate(660, 0)">
      <rect width="180" height="160" rx="14" fill="#311042" stroke="#d946ef" stroke-width="2.5"/>
      <rect x="14" y="14" width="40" height="40" rx="10" fill="#a21caf"/>
      <text x="34" y="39" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
      <text x="64" y="32" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f0abfc">30' – 70' (40')</text>
      <text x="64" y="48" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Cao Điểm Dự Án</text>
      <text x="14" y="85" font-family="Arial, sans-serif" font-size="11.5" fill="#f5d0fe">• Soạn thảo đồng thời</text>
      <text x="14" y="105" font-family="Arial, sans-serif" font-size="11.5" fill="#f5d0fe">• Chèn bảng biểu, hình ảnh</text>
      <text x="14" y="125" font-family="Arial, sans-serif" font-size="11.5" fill="#f5d0fe">• Comment &amp; Suggesting</text>
    </g>

    <!-- Lower Row connecting -->
    <!-- Down Arrow from Stage 4 -->
    <line x1="750" y1="160" x2="750" y2="200" stroke="#d946ef" stroke-width="3" stroke-dasharray="4,4"/>

    <!-- Stage 5: REVIEW CHÉO -->
    <g transform="translate(660, 200)">
      <rect width="180" height="160" rx="14" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
      <rect x="14" y="14" width="40" height="40" rx="10" fill="#be185d"/>
      <text x="34" y="39" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
      <text x="64" y="32" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f472b6">70' – 80'</text>
      <text x="64" y="48" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Review Chéo Nhóm</text>
      <text x="14" y="85" font-family="Arial, sans-serif" font-size="11.5" fill="#cbd5e1">• Nhóm A review nhóm B</text>
      <text x="14" y="105" font-family="Arial, sans-serif" font-size="11.5" fill="#cbd5e1">• Dùng Comment soi lỗi</text>
      <text x="14" y="125" font-family="Arial, sans-serif" font-size="11.5" fill="#cbd5e1">• Góp ý chân thành, tôn trọng</text>
    </g>

    <!-- Connector 5 (Leftwards) -->
    <line x1="660" y1="280" x2="620" y2="280" stroke="#f472b6" stroke-width="3" stroke-dasharray="4,4"/>

    <!-- Stage 6: CHỈNH SỬA & XUẤT BẢN -->
    <g transform="translate(440, 200)">
      <rect width="180" height="160" rx="14" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
      <rect x="14" y="14" width="40" height="40" rx="10" fill="#0891b2"/>
      <text x="34" y="39" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
      <text x="64" y="32" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#67e8f9">80' – 90'</text>
      <text x="64" y="48" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Chỉnh Sửa &amp; PDF</text>
      <text x="14" y="85" font-family="Arial, sans-serif" font-size="11.5" fill="#cbd5e1">• Cập nhật Mục lục TOC</text>
      <text x="14" y="105" font-family="Arial, sans-serif" font-size="11.5" fill="#cbd5e1">• Đặt tên Version History</text>
      <text x="14" y="125" font-family="Arial, sans-serif" font-size="11.5" fill="#cbd5e1">• Tải xuống file PDF chuẩn</text>
    </g>

    <!-- Connector 6 (Leftwards) -->
    <line x1="440" y1="280" x2="400" y2="280" stroke="#06b6d4" stroke-width="3" stroke-dasharray="4,4"/>

    <!-- Stage 7 & 8: TRÌNH BÀY & VINH DANH -->
    <g transform="translate(0, 200)">
      <rect width="400" height="160" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="2.5"/>
      <rect x="20" y="20" width="50" height="50" rx="12" fill="#059669"/>
      <text x="45" y="52" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">🏆</text>
      <text x="85" y="38" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#6ee7b7">90' – 100' (10 PHÚT CHUNG CUỘC)</text>
      <text x="85" y="60" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Báo Cáo Nhanh &amp; Tốt Nghiệp Khóa Học</text>
      
      <rect x="20" y="85" width="360" height="60" rx="8" fill="#022c22"/>
      <text x="32" y="108" font-family="Arial, sans-serif" font-size="12" fill="#a7f3d0">• Mỗi nhóm 2 phút chiếu file PDF &amp; trình bày điểm tự hào nhất</text>
      <text x="32" y="128" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34d399">• Giáo viên trao nhận xét &amp; vinh danh các chuyên gia Google Docs THCS!</text>
    </g>

  </g>

  <!-- Bottom Tip -->
  <rect x="60" y="485" width="840" height="36" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="80" y="508" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24">⏳ NGUYÊN TẮC THÀNH CÔNG:</text>
  <text x="270" y="508" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">Bám sát lộ trình từng phút, phối hợp ăn ý giữa 4 thành viên và luôn tin tưởng đồng đội!</text>
</svg>
