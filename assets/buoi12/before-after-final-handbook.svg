<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bafhBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
    <filter id="handShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#bafhBg)"/>

  <!-- Badge Header -->
  <rect x="220" y="20" width="520" height="42" rx="21" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="480" y="47" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fbbf24" text-anchor="middle">
    BEFORE &amp; AFTER: HÀNH TRÌNH LỘT XÁC SAU 12 BUỔI GOOGLE DOCS
  </text>

  <!-- Left Side: BEFORE (Buổi 1) -->
  <g transform="translate(40, 85)" filter="url(#handShadow)">
    <rect width="420" height="420" rx="14" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
    
    <!-- Top banner -->
    <rect width="420" height="44" rx="14" fill="#fee2e2"/>
    <text x="20" y="28" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#b91c1c">❌ TRƯỚC KHÓA HỌC: Soạn thảo bản năng</text>

    <!-- Content -->
    <g transform="translate(24, 65)">
      <text x="0" y="22" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Văn bản rời rạc, không cấu trúc</text>
      <text x="0" y="48" font-family="Arial, sans-serif" font-size="12" fill="#64748b">• Tự gõ số trang bằng tay, bấm phím cách (Space) để lùi dòng</text>
      
      <!-- Flawed representation -->
      <rect x="0" y="65" width="372" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="14" y="90" font-family="Arial, sans-serif" font-size="12" fill="#334155">"Cam nang hoc tap thcs... viet boi An va Binh"</text>
      <text x="14" y="112" font-family="Arial, sans-serif" font-size="12" fill="#dc2626">Không có Heading, chỉ bôi đen in đậm bừa bãi</text>
      <text x="14" y="138" font-family="Arial, sans-serif" font-size="11" fill="#dc2626">⚠ Không có Mục lục, độc giả không biết tìm bài ở đâu</text>
      <text x="14" y="158" font-family="Arial, sans-serif" font-size="11" fill="#dc2626">⚠ Ảnh chèn vào làm vỡ tung toàn bộ trang giấy</text>
      <text x="14" y="178" font-family="Arial, sans-serif" font-size="11" fill="#dc2626">⚠ Bạn khác vào sửa đè làm mất đoạn văn quan trọng</text>

      <!-- Flaw list -->
      <rect x="0" y="235" width="372" height="105" rx="8" fill="#fef2f2"/>
      <text x="14" y="260" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#991b1b">Hạn chế của người chưa học bài bản:</text>
      <text x="14" y="282" font-family="Arial, sans-serif" font-size="11" fill="#b91c1c">✖ Mất nhiều thời gian căn chỉnh thủ công mà vẫn xấu</text>
      <text x="14" y="302" font-family="Arial, sans-serif" font-size="11" fill="#b91c1c">✖ Bị trừ điểm nặng trong các bài thi và báo cáo môn học</text>
      <text x="14" y="322" font-family="Arial, sans-serif" font-size="11" fill="#b91c1c">✖ Lúng túng, ngại làm việc nhóm khi thầy cô giao dự án</text>
    </g>
  </g>

  <!-- Right Side: AFTER (Buổi 12) -->
  <g transform="translate(500, 85)" filter="url(#handShadow)">
    <rect width="420" height="420" rx="14" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    
    <!-- Top banner -->
    <rect width="420" height="44" rx="14" fill="#d1fae5"/>
    <text x="20" y="28" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#065f46">✔ SAU 12 BUỔI: Tác giả xuất bản chuyên nghiệp</text>

    <!-- Content -->
    <g transform="translate(24, 65)">
      <text x="0" y="22" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0f172a">CẨM NANG HỌC TẬP DÀNH CHO HỌC SINH THCS</text>
      <text x="0" y="48" font-family="Arial, sans-serif" font-size="12" fill="#059669">• Tác phẩm hợp tác của nhóm 4 học sinh tinh hoa</text>

      <!-- Ideal document card -->
      <rect x="0" y="65" width="372" height="150" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="14" y="88" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">✓ Trang bìa trang trọng &amp; Mục lục TOC tự động</text>
      <text x="14" y="108" font-family="Arial, sans-serif" font-size="11.5" fill="#15803d">✓ Cây phân cấp Heading 1, 2 khoa học, có Header &amp; Footer</text>
      <text x="14" y="128" font-family="Arial, sans-serif" font-size="11.5" fill="#15803d">✓ Bảng biểu phối màu hài hòa, có dòng tiêu đề nổi bật</text>
      <text x="14" y="148" font-family="Arial, sans-serif" font-size="11.5" fill="#15803d">✓ Comment &amp; Suggesting thảo luận văn minh, lịch sử rõ ràng</text>
      <text x="14" y="170" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">✓ Xuất bản file PDF chuẩn in ấn, khóa cứng trang 100%!</text>

      <!-- Benefits list -->
      <rect x="0" y="235" width="372" height="105" rx="8" fill="#f0fdf4"/>
      <text x="14" y="260" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534">Năng lực số đạt được trọn đời:</text>
      <text x="14" y="282" font-family="Arial, sans-serif" font-size="11" fill="#15803d">✔ Tự tin dẫn dắt các bài thuyết trình, dự án STEM cấp trường</text>
      <text x="14" y="302" font-family="Arial, sans-serif" font-size="11" fill="#15803d">✔ Sở hữu Portfolio cá nhân ấn tượng để ứng tuyển học bổng</text>
      <text x="14" y="322" font-family="Arial, sans-serif" font-size="11" fill="#15803d">✔ Tác phong công nghệ hiện đại, sẵn sàng cho tương lai số!</text>
    </g>
  </g>
</svg>
