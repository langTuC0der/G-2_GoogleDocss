<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="rubBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="rubShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#rubBg)"/>

  <!-- Title Badge -->
  <rect x="230" y="20" width="500" height="42" rx="21" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="480" y="47" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#38bdf8" text-anchor="middle">
    MA TRẬN ĐÁNH GIÁ 360° FINAL PROJECT (THANG ĐIỂM 40)
  </text>

  <!-- 4 Pillars Grid -->
  <g transform="translate(40, 85)" filter="url(#rubShadow)">
    
    <!-- Pillar 1 -->
    <g transform="translate(0, 0)">
      <rect width="205" height="415" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
      <rect x="14" y="14" width="40" height="40" rx="10" fill="#2563eb"/>
      <text x="34" y="39" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">I</text>
      <text x="64" y="32" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#93c5fd">BỐ CỤC &amp; TOC</text>
      <text x="64" y="48" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#60a5fa">Tối đa 10 Điểm</text>

      <rect x="12" y="70" width="181" height="330" rx="10" fill="#0f172a" fill-opacity="0.6"/>
      <text x="22" y="96" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">• Trang bìa dự án (2đ):</text>
      <text x="22" y="116" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Title to rõ, tên nhóm, lớp, năm học 2026.</text>

      <text x="22" y="148" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">• Phân cấp Styles (3đ):</text>
      <text x="22" y="168" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Dùng chuẩn Heading 1, Heading 2 có hệ thống.</text>

      <text x="22" y="200" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">• Ngắt trang Page Break (2đ):</text>
      <text x="22" y="220" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Mỗi chương lớn sang trang mới bằng Ctrl+Enter.</text>

      <text x="22" y="252" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">• Mục lục tự động TOC (3đ):</text>
      <text x="22" y="272" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Có số trang hoặc link xanh, đã bấm nút Cập nhật.</text>
    </g>

    <!-- Pillar 2 -->
    <g transform="translate(225, 0)">
      <rect width="205" height="415" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
      <rect x="14" y="14" width="40" height="40" rx="10" fill="#059669"/>
      <text x="34" y="39" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">II</text>
      <text x="64" y="32" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#a7f3d0">KỸ THUẬT DOCS</text>
      <text x="64" y="48" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34d399">Tối đa 10 Điểm</text>

      <rect x="12" y="70" width="181" height="330" rx="10" fill="#0f172a" fill-opacity="0.6"/>
      <text x="22" y="96" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34d399">• Căn lề &amp; Giãn dòng (2đ):</text>
      <text x="22" y="116" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Justified đều 2 bên, khoảng cách dòng 1.25.</text>

      <text x="22" y="148" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34d399">• Bảng biểu Table (3đ):</text>
      <text x="22" y="168" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Có dòng tiêu đề nổi bật, căn lề số liệu chuẩn xác.</text>

      <text x="22" y="200" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34d399">• Hình ảnh &amp; Link (3đ):</text>
      <text x="22" y="220" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Ảnh có bọc chữ (wrap text), kèm hyperlink nguồn.</text>

      <text x="22" y="252" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34d399">• Header/Footer (2đ):</text>
      <text x="22" y="272" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Số trang tự động, tên cẩm nang ở đầu trang.</text>
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(450, 0)">
      <rect width="205" height="415" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
      <rect x="14" y="14" width="40" height="40" rx="10" fill="#d97706"/>
      <text x="34" y="39" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">III</text>
      <text x="64" y="32" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fde68a">CỘNG TÁC NHÓM</text>
      <text x="64" y="48" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24">Tối đa 10 Điểm</text>

      <rect x="12" y="70" width="181" height="330" rx="10" fill="#0f172a" fill-opacity="0.6"/>
      <text x="22" y="96" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24">• Phân công 3-4 bạn (3đ):</text>
      <text x="22" y="116" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Các bạn đều có đóng góp rõ ràng trong file.</text>

      <text x="22" y="148" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24">• Comment &amp; Reply (2đ):</text>
      <text x="22" y="168" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Có ít nhất 2 bình luận trao đổi và đã bấm Resolve.</text>

      <text x="22" y="200" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24">• Suggesting (2đ):</text>
      <text x="22" y="220" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Có vết mực xanh đề xuất và đã bấm Duyệt (Accept).</text>

      <text x="22" y="252" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24">• Version History (3đ):</text>
      <text x="22" y="272" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Có ít nhất 1 phiên bản được đặt tên rõ ràng.</text>
    </g>

    <!-- Pillar 4 -->
    <g transform="translate(675, 0)">
      <rect width="205" height="415" rx="14" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
      <rect x="14" y="14" width="40" height="40" rx="10" fill="#be185d"/>
      <text x="34" y="39" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">IV</text>
      <text x="64" y="32" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fbcfe8">PDF &amp; BÁO CÁO</text>
      <text x="64" y="48" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f472b6">Tối đa 10 Điểm</text>

      <rect x="12" y="70" width="181" height="330" rx="10" fill="#0f172a" fill-opacity="0.6"/>
      <text x="22" y="96" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f472b6">• Xuất file PDF chuẩn (4đ):</text>
      <text x="22" y="116" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Không có trang trắng thừa, lề A4 chuẩn chỉ.</text>

      <text x="22" y="148" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f472b6">• Báo cáo 2 phút (3đ):</text>
      <text x="22" y="168" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Trình bày tự tin, giới thiệu điểm đặc sắc của Cẩm nang.</text>

      <text x="22" y="200" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f472b6">• Tinh thần đồng đội (3đ):</text>
      <text x="22" y="220" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Cả nhóm cùng lên sân khấu, chia sẻ trải nghiệm.</text>

      <text x="22" y="252" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f472b6">• Sản phẩm nộp đủ (1đ):</text>
      <text x="22" y="272" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Nộp 1 link Docs + 1 file PDF hoàn chỉnh.</text>
    </g>

  </g>
</svg>
