<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%" height="100%">
  <defs>
    <linearGradient id="treeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="800" height="380" rx="16" fill="url(#treeBg)"/>

  <!-- Level 0: TITLE -->
  <g transform="translate(60, 30)" filter="url(#cardShadow)">
    <rect width="680" height="60" rx="12" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="36" cy="30" r="16" fill="#fbbf24"/>
    <text x="36" y="36" font-family="'Outfit', sans-serif" font-size="16" font-weight="900" fill="#0f172a" text-anchor="middle">👑</text>
    <text x="70" y="27" font-family="'Outfit', sans-serif" font-size="17" font-weight="800" fill="#ffffff">TITLE · Tiêu đề chính</text>
    <text x="70" y="47" font-family="'Inter', sans-serif" font-size="12" fill="#93c5fd">Tên của cả tài liệu (ví dụ: ĐỘNG VẬT QUANH TA) — Thường chỉ xuất hiện 1 lần duy nhất ở đầu trang</text>
  </g>

  <!-- Connectors -->
  <path d="M 180 90 L 180 130" stroke="#3b82f6" stroke-width="3" stroke-dasharray="4 4"/>
  <path d="M 600 90 L 600 130" stroke="#3b82f6" stroke-width="3" stroke-dasharray="4 4"/>

  <!-- Level 1: HEADING 1 (2 Branches) -->
  <g transform="translate(60, 130)" filter="url(#cardShadow)">
    <rect width="320" height="64" rx="10" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
    <rect x="14" y="14" width="36" height="36" rx="8" fill="#e0f2fe"/>
    <text x="32" y="38" font-family="'Outfit', sans-serif" font-size="16" font-weight="900" fill="#0369a1" text-anchor="middle">H1</text>
    <text x="60" y="32" font-family="'Outfit', sans-serif" font-size="15" font-weight="800" fill="#ffffff">Heading 1: Phần lớn A</text>
    <text x="60" y="50" font-family="'Inter', sans-serif" font-size="11.5" fill="#bae6fd">Ví dụ: Chương 1 · Động vật trên cạn</text>
  </g>

  <g transform="translate(420, 130)" filter="url(#cardShadow)">
    <rect width="320" height="64" rx="10" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
    <rect x="14" y="14" width="36" height="36" rx="8" fill="#e0f2fe"/>
    <text x="32" y="38" font-family="'Outfit', sans-serif" font-size="16" font-weight="900" fill="#0369a1" text-anchor="middle">H1</text>
    <text x="60" y="32" font-family="'Outfit', sans-serif" font-size="15" font-weight="800" fill="#ffffff">Heading 1: Phần lớn B</text>
    <text x="60" y="50" font-family="'Inter', sans-serif" font-size="11.5" fill="#bae6fd">Ví dụ: Chương 2 · Động vật dưới nước</text>
  </g>

  <!-- Connectors to H2 -->
  <path d="M 140 194 L 140 230" stroke="#0284c7" stroke-width="2.5"/>
  <path d="M 290 194 L 290 230" stroke="#0284c7" stroke-width="2.5"/>
  <path d="M 500 194 L 500 230" stroke="#0284c7" stroke-width="2.5"/>
  <path d="M 650 194 L 650 230" stroke="#0284c7" stroke-width="2.5"/>

  <!-- Level 2: HEADING 2 (4 Sub-items) -->
  <g transform="translate(60, 230)" filter="url(#cardShadow)">
    <rect width="155" height="60" rx="8" fill="#0f766e" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="14" y="26" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#5eead4">HEADING 2</text>
    <text x="14" y="46" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff">1. Con hổ</text>
  </g>

  <g transform="translate(225, 230)" filter="url(#cardShadow)">
    <rect width="155" height="60" rx="8" fill="#0f766e" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="14" y="26" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#5eead4">HEADING 2</text>
    <text x="14" y="46" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff">2. Con voi</text>
  </g>

  <g transform="translate(420, 230)" filter="url(#cardShadow)">
    <rect width="155" height="60" rx="8" fill="#0f766e" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="14" y="26" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#5eead4">HEADING 2</text>
    <text x="14" y="46" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff">1. Cá mập</text>
  </g>

  <g transform="translate(585, 230)" filter="url(#cardShadow)">
    <rect width="155" height="60" rx="8" fill="#0f766e" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="14" y="26" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#5eead4">HEADING 2</text>
    <text x="14" y="46" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff">2. Cá heo</text>
  </g>

  <!-- Level 3: NORMAL TEXT note at bottom -->
  <g transform="translate(60, 312)">
    <rect width="680" height="42" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="340" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#cbd5e1" text-anchor="middle">
      📝 Bên dưới mỗi Heading 2 là các đoạn văn bản thường (<tspan fill="#38bdf8" font-weight="700">Normal text</tspan>) mô tả đặc điểm, nơi sống...
    </text>
  </g>
</svg>
