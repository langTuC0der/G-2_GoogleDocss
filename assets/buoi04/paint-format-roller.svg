<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="100%" height="100%">
  <defs>
    <linearGradient id="rollerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#3b82f6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="340" rx="16" fill="url(#rollerBg)"/>

  <!-- Left: Mẫu gốc đã đẹp -->
  <g transform="translate(40, 40)">
    <rect width="210" height="250" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect width="210" height="40" rx="12" fill="#dbeafe"/>
    <text x="105" y="25" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#1e40af" text-anchor="middle">BƯỚC 1: CHỌN MẪU GỐC</text>
    
    <g transform="translate(15, 60)">
      <rect width="180" height="45" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
      <text x="14" y="28" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#1d4ed8">CHƯƠNG 1</text>
      <text x="14" y="58" font-family="'Inter', sans-serif" font-size="10.5" fill="#64748b">Font 18pt, In đậm, Xanh</text>
    </g>
    <text x="105" y="160" font-family="'Inter', sans-serif" font-size="11" fill="#475569" text-anchor="middle">Đã căn chỉnh font, màu,</text>
    <text x="105" y="178" font-family="'Inter', sans-serif" font-size="11" fill="#475569" text-anchor="middle">cỡ chữ hoàn hảo.</text>
    <rect x="25" y="200" width="160" height="30" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="105" y="220" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle">1. Đặt con trỏ vào đây</text>
  </g>

  <!-- Middle: Nút Paint Format Roller -->
  <g transform="translate(290, 75)" filter="url(#glow)">
    <circle cx="110" cy="85" r="50" fill="#2563eb"/>
    <!-- Roller Icon -->
    <path d="M 90 65 L 125 65 L 125 80 L 90 80 Z" fill="#fbbf24"/>
    <path d="M 125 72 L 135 72 L 135 95 L 110 95 L 110 115" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="104" y="115" width="12" height="22" rx="3" fill="#cbd5e1"/>

    <text x="110" y="160" font-family="'Outfit', sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">PAINT FORMAT</text>
    <text x="110" y="178" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#93c5fd" text-anchor="middle">Con lăn sơn sao chép</text>
  </g>

  <!-- Connectors -->
  <path d="M 255 160 L 280 160" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  <polygon points="280,155 292,160 280,165" fill="#3b82f6"/>

  <path d="M 515 160 L 540 160" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <polygon points="540,155 552,160 540,165" fill="#10b981"/>

  <!-- Right: Áp dụng lên mục đích -->
  <g transform="translate(550, 40)">
    <rect width="210" height="250" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect width="210" height="40" rx="12" fill="#d1fae5"/>
    <text x="105" y="25" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#065f46" text-anchor="middle">BƯỚC 3: QUÉT LÊN MỤC KHÁC</text>

    <g transform="translate(15, 60)">
      <rect width="180" height="40" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="14" y="25" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" fill="#1d4ed8">CHƯƠNG 2: THỰC VẬT</text>
    </g>

    <g transform="translate(15, 115)">
      <rect width="180" height="40" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="14" y="25" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" fill="#1d4ed8">CHƯƠNG 3: CON NGƯỜI</text>
    </g>

    <rect x="15" y="175" width="180" height="55" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="24" y="195" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#047857">💡 Mẹo click đúp (Double-click):</text>
    <text x="24" y="213" font-family="'Inter', sans-serif" font-size="10" fill="#15803d">Sơn liên tục nhiều đoạn cùng lúc!</text>
  </g>
</svg>
