<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="360" rx="16" fill="url(#bgG)"/>

  <!-- Left Card: Tài liệu không có bộ xương -->
  <g transform="translate(40, 35)" filter="url(#shadow)">
    <rect width="330" height="290" rx="12" fill="#ffffff"/>
    <rect width="330" height="42" rx="12" fill="#fee2e2"/>
    <text x="20" y="27" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#dc2626">❌ KHÔNG CÓ BỘ XƯƠNG (STYLES)</text>
    
    <!-- Collapsed unorganized text lines -->
    <rect x="25" y="65" width="280" height="10" rx="4" fill="#94a3b8"/>
    <rect x="25" y="85" width="260" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="25" y="101" width="275" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="25" y="117" width="250" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="25" y="133" width="280" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="25" y="155" width="220" height="10" rx="4" fill="#94a3b8"/>
    <rect x="25" y="175" width="270" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="25" y="191" width="240" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="25" y="207" width="265" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="25" y="223" width="250" height="8" rx="4" fill="#cbd5e1"/>

    <!-- Warning box -->
    <rect x="20" y="248" width="290" height="30" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="30" y="268" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#b91c1c">Người đọc và máy tính không biết đâu là mục lớn/nhỏ</text>
  </g>

  <!-- Right Card: Tài liệu có bộ xương Styles -->
  <g transform="translate(430, 35)" filter="url(#shadow)">
    <rect width="330" height="290" rx="12" fill="#ffffff"/>
    <rect width="330" height="42" rx="12" fill="#dbeafe"/>
    <text x="20" y="27" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#1d4ed8">✅ CÓ BỘ XƯƠNG CHUẨN (HEADING 1-2-3)</text>
    
    <!-- Title -->
    <rect x="25" y="60" width="200" height="16" rx="4" fill="url(#blueG)"/>
    <text x="235" y="73" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" fill="#2563eb">TITLE</text>
    
    <!-- Heading 1 -->
    <rect x="25" y="90" width="160" height="13" rx="3" fill="#0284c7"/>
    <text x="195" y="101" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#0284c7">HEADING 1</text>
    
    <!-- Heading 2 (indented) -->
    <rect x="45" y="112" width="130" height="10" rx="3" fill="#0d9488"/>
    <text x="185" y="121" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#0d9488">HEADING 2</text>
    <!-- Normal text -->
    <rect x="45" y="130" width="240" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="45" y="142" width="220" height="6" rx="3" fill="#cbd5e1"/>

    <!-- Heading 2 (indented) -->
    <rect x="45" y="160" width="140" height="10" rx="3" fill="#0d9488"/>
    <text x="195" y="169" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#0d9488">HEADING 2</text>
    <!-- Normal text -->
    <rect x="45" y="178" width="230" height="6" rx="3" fill="#cbd5e1"/>

    <!-- Heading 1 -->
    <rect x="25" y="200" width="170" height="13" rx="3" fill="#0284c7"/>
    <text x="205" y="211" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#0284c7">HEADING 1</text>
    <!-- Normal text -->
    <rect x="45" y="222" width="240" height="6" rx="3" fill="#cbd5e1"/>

    <!-- Benefit box -->
    <rect x="20" y="248" width="290" height="30" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
    <text x="30" y="268" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#047857">⚡ Tự động tạo mục lục & bật thanh phác thảo Outline</text>
  </g>
</svg>
