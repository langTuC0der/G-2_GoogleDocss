<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="uiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="360" rx="16" fill="url(#uiBg)"/>

  <!-- Left Panel: Document Outline (Sơ đồ tài liệu) -->
  <g transform="translate(40, 30)">
    <rect width="260" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="260" height="42" rx="12" fill="#f1f5f9"/>
    <text x="18" y="26" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#1e293b">📑 DOCUMENT OUTLINE</text>

    <!-- Outline items -->
    <g transform="translate(18, 58)">
      <circle cx="6" cy="10" r="4" fill="#2563eb"/>
      <text x="18" y="14" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">ĐỘNG VẬT QUANH TA</text>
    </g>

    <g transform="translate(28, 92)">
      <circle cx="6" cy="8" r="3" fill="#0284c7"/>
      <text x="16" y="12" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#0369a1">1. Động vật trên cạn</text>
    </g>

    <g transform="translate(44, 122)">
      <text x="10" y="10" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">• Con hổ</text>
    </g>

    <g transform="translate(44, 146)">
      <text x="10" y="10" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">• Con voi</text>
    </g>

    <g transform="translate(28, 178)">
      <circle cx="6" cy="8" r="3" fill="#0284c7"/>
      <text x="16" y="12" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#0369a1">2. Động vật dưới nước</text>
    </g>

    <g transform="translate(44, 208)">
      <text x="10" y="10" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">• Cá mập</text>
    </g>

    <g transform="translate(44, 232)">
      <text x="10" y="10" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">• Cá heo</text>
    </g>

    <rect x="12" y="260" width="236" height="28" rx="6" fill="#eff6ff"/>
    <text x="130" y="278" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#2563eb" text-anchor="middle">👉 Bấm vào mục để bay ngay đến trang!</text>
  </g>

  <!-- Right: Sức mạnh đồng bộ Update to Match -->
  <g transform="translate(330, 30)">
    <rect width="430" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="430" height="42" rx="12" fill="#fef3c7"/>
    <text x="20" y="26" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#92400e">⚡ TÍNH NĂNG KỲ DIỆU: "UPDATE TO MATCH"</text>

    <g transform="translate(20, 60)">
      <rect width="390" height="70" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="15" y="24" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#2563eb">Đổi 1 lần → Cập nhật hàng loạt</text>
      <text x="15" y="45" font-family="'Inter', sans-serif" font-size="11.5" fill="#475569">Nếu tài liệu có 50 đề mục Heading 1, em chỉ cần chỉnh sửa 1 mục</text>
      <text x="15" y="62" font-family="'Inter', sans-serif" font-size="11.5" fill="#475569">rồi bấm "Update 'Heading 1' to match", cả 49 mục còn lại tự đổi theo!</text>
    </g>

    <!-- Context menu mockup -->
    <g transform="translate(20, 146)">
      <rect width="390" height="135" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect x="10" y="10" width="370" height="32" rx="6" fill="#334155"/>
      <text x="24" y="31" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Apply 'Heading 1' (Áp dụng tiêu đề 1)</text>
      
      <rect x="10" y="48" width="370" height="34" rx="6" fill="#2563eb"/>
      <text x="24" y="70" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#ffffff">✓ Update 'Heading 1' to match (Cập nhật để khớp)</text>
      
      <text x="24" y="112" font-family="'Inter', sans-serif" font-size="11" fill="#93c5fd">✨ Giúp toàn bộ tài liệu nhất quán 100% trong 1 giây!</text>
    </g>
  </g>
</svg>
