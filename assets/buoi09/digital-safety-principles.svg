<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b152d"/>
      <stop offset="100%" stop-color="#162a54"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="920" height="460" rx="20" fill="url(#bgGrad)"/>
  <text x="460" y="42" font-family="'Outfit', sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">NGUYÊN TẮC AN TOÀN SỐ &amp; CẤP QUYỀN TỐI THIỂU (LEAST PRIVILEGE)</text>
  <text x="460" y="68" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#93c5fd" text-anchor="middle">Bảo vệ dữ liệu cá nhân · Quyền tối thiểu · Khóa sao chép &amp; Thu hồi quyền khi xong việc</text>

  <g transform="translate(40, 88)" filter="url(#shadow)">
    <rect width="840" height="344" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

    <g transform="translate(25, 20)">
      <!-- Rule 1 -->
      <g transform="translate(0, 0)">
        <rect width="380" height="135" rx="10" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.2"/>
        <text x="20" y="30" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#be123c">🚫 1. BẢO MẬT DỮ LIỆU CÁ NHÂN</text>
        <text x="20" y="52" font-family="'Inter', sans-serif" font-size="9" fill="#881337" line-height="1.6">
          Tuyệt đối không để lộ trong file chia sẻ công khai:
        </text>
        <text x="30" y="72" font-family="'Inter', sans-serif" font-size="8.8" font-weight="600" fill="#9f1239">• Số điện thoại phụ huynh, địa chỉ nhà riêng</text>
        <text x="30" y="90" font-family="'Inter', sans-serif" font-size="8.8" font-weight="600" fill="#9f1239">• Mật khẩu tài khoản, số CCCD / mã định danh</text>
        <text x="30" y="108" font-family="'Inter', sans-serif" font-size="8.8" font-weight="600" fill="#9f1239">• Các thông tin học tập xếp loại nhạy cảm</text>
      </g>

      <!-- Rule 2 -->
      <g transform="translate(410, 0)">
        <rect width="380" height="135" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
        <text x="20" y="30" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#1d4ed8">⚖️ 2. NGUYÊN TẮC QUYỀN TỐI THIỂU</text>
        <text x="20" y="52" font-family="'Inter', sans-serif" font-size="9" fill="#1e40af" line-height="1.6">
          Chỉ cấp đúng mức quyền cần thiết nhất:
        </text>
        <text x="30" y="72" font-family="'Inter', sans-serif" font-size="8.8" font-weight="600" fill="#1e3a8a">• Cần đọc để biết? ➔ Cấp <b>Viewer</b></text>
        <text x="30" y="90" font-family="'Inter', sans-serif" font-size="8.8" font-weight="600" fill="#1e3a8a">• Cần xin nhận xét góp ý? ➔ Cấp <b>Commenter</b></text>
        <text x="30" y="108" font-family="'Inter', sans-serif" font-size="8.8" font-weight="600" fill="#1e3a8a">• Chỉ cấp <b>Editor</b> cho người cùng chịu trách nhiệm!</text>
      </g>

      <!-- Rule 3 -->
      <g transform="translate(0, 150)">
        <rect width="380" height="135" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
        <text x="20" y="30" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#15803d">🔒 3. KHÓA TẢI XUỐNG &amp; IN ẤN</text>
        <text x="20" y="52" font-family="'Inter', sans-serif" font-size="9" fill="#14532d" line-height="1.6">
          Trong bánh răng Cài đặt chia sẻ ⚙️:
        </text>
        <text x="30" y="72" font-family="'Inter', sans-serif" font-size="8.8" font-weight="600" fill="#166534">• Bỏ tích "Người xem và nhận xét có thể tải xuống, in và sao chép"</text>
        <text x="30" y="94" font-family="'Inter', sans-serif" font-size="8.8" font-weight="600" fill="#166534">• Ngăn chặn việc sao chép bài tiểu luận của em mang đi nộp!</text>
      </g>

      <!-- Rule 4 -->
      <g transform="translate(410, 150)">
        <rect width="380" height="135" rx="10" fill="#fef3c7" stroke="#fde68a" stroke-width="1.2"/>
        <text x="20" y="30" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#b45309">🗑️ 4. THU HỒI QUYỀN (REMOVE ACCESS)</text>
        <text x="20" y="52" font-family="'Inter', sans-serif" font-size="9" fill="#78350f" line-height="1.6">
          Quản lý vòng đời chia sẻ:
        </text>
        <text x="30" y="72" font-family="'Inter', sans-serif" font-size="8.8" font-weight="600" fill="#92400e">• Khi dự án nhóm kết thúc hoặc nộp bài xong</text>
        <text x="30" y="90" font-family="'Inter', sans-serif" font-size="8.8" font-weight="600" fill="#92400e">• Chuyển Editor về Viewer hoặc bấm <b>Xóa quyền truy cập</b></text>
        <text x="30" y="108" font-family="'Inter', sans-serif" font-size="8.8" font-weight="600" fill="#92400e">• Đảm bảo bài nộp cuối cùng không bị chỉnh sửa trộm.</text>
      </g>
    </g>
  </g>
</svg>
