<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b152d"/>
      <stop offset="100%" stop-color="#162a54"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="920" height="460" rx="20" fill="url(#bgGrad)"/>
  <text x="460" y="42" font-family="'Outfit', sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">CHẾ ĐỘ TRUY CẬP CHUNG: RESTRICTED VS ANYONE WITH THE LINK</text>
  <text x="460" y="68" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#93c5fd" text-anchor="middle">Bị hạn chế (Chỉ người được mời) vs Bất kỳ ai có đường liên kết (Mở rộng toàn mạng)</text>

  <g transform="translate(40, 88)" filter="url(#shadow)">
    <rect width="840" height="344" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Left: Restricted -->
    <g transform="translate(30, 20)">
      <rect width="365" height="30" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
      <text x="182" y="19" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" fill="#1d4ed8" text-anchor="middle">🔒 RESTRICTED (BỊ HẠN CHẾ) — MẶC ĐỊNH AN TOÀN</text>

      <g transform="translate(15, 42)">
        <rect width="335" height="215" rx="8" fill="#f8fafc" stroke="#bfdbfe" stroke-width="1.5"/>

        <g transform="translate(20, 20)">
          <circle cx="28" cy="28" r="26" fill="#dbeafe"/>
          <text x="28" y="37" font-size="24" text-anchor="middle">🛡️</text>

          <text x="68" y="24" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#1e3a8a">Chỉ Ai Được Thêm Mới Mở</text>
          <text x="68" y="40" font-family="'Inter', sans-serif" font-size="9" fill="#64748b">Cần đăng nhập đúng tài khoản Gmail</text>

          <line x1="0" y1="65" x2="295" y2="65" stroke="#e2e8f0" stroke-width="1"/>

          <g transform="translate(0, 80)" font-family="'Inter', sans-serif" font-size="9.5" fill="#334155" line-height="1.6">
            <text x="0" y="0">• Người lạ nhặt được link sẽ bị chặn cửa "Yêu cầu quyền truy cập".</text>
            <text x="0" y="24">• Em kiểm soát chính xác từng email của thầy cô và bạn bè.</text>
            <text x="0" y="48">• Chế độ an toàn 100% cho tài liệu học tập cá nhân.</text>
          </g>

          <rect x="0" y="145" width="295" height="36" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
          <text x="147" y="167" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#1d4ed8" text-anchor="middle">✅ KHUYÊN DÙNG CHO 90% TÀI LIỆU CỦA EM!</text>
        </g>
      </g>

      <text x="182" y="285" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">Bảo mật tối đa: Không sợ lộ thông tin ra ngoài lớp học</text>
    </g>

    <!-- Right: Anyone with link -->
    <g transform="translate(440, 20)">
      <rect width="365" height="30" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="182" y="19" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" fill="#b45309" text-anchor="middle">🌐 ANYONE WITH THE LINK (BẤT KỲ AI CÓ LINK)</text>

      <g transform="translate(15, 42)">
        <rect width="335" height="215" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>

        <g transform="translate(20, 20)">
          <circle cx="28" cy="28" r="26" fill="#fef3c7"/>
          <text x="28" y="37" font-size="24" text-anchor="middle">🌍</text>

          <text x="68" y="24" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#92400e">Ai Bấm Vào Link Đều Đọc Được</text>
          <text x="68" y="40" font-family="'Inter', sans-serif" font-size="9" fill="#b45309">Không cần xin quyền, không cần biết email</text>

          <line x1="0" y1="65" x2="295" y2="65" stroke="#fde68a" stroke-width="1"/>

          <g transform="translate(0, 80)" font-family="'Inter', sans-serif" font-size="9.5" fill="#78350f" line-height="1.6">
            <text x="0" y="0">• Tiện lợi khi gửi thông báo chung cho cả phụ huynh và toàn trường.</text>
            <text x="0" y="24">• Người vào xem sẽ xuất hiện dưới dạng "Động vật ẩn danh" 🦊.</text>
          </g>

          <!-- Danger Box -->
          <rect x="0" y="130" width="295" height="52" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
          <text x="147" y="150" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#991b1b" text-anchor="middle">⛔ NGUY HIỂM CHẾT NGƯỜI:</text>
          <text x="147" y="168" font-family="'Inter', sans-serif" font-size="8.2" font-weight="600" fill="#b91c1c" text-anchor="middle">CẤM chọn "Anyone with link + Editor" (bài sẽ bị phá nát)!</text>
        </g>
      </g>

      <text x="182" y="285" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" fill="#b45309" text-anchor="middle">Chỉ dùng khi làm Viewer (đọc thông báo, tài liệu mẫu)</text>
    </g>
  </g>
</svg>
