<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b152d"/>
      <stop offset="100%" stop-color="#162a54"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="920" height="460" rx="20" fill="url(#bgGrad)"/>
  <text x="460" y="42" font-family="'Outfit', sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">SO SÁNH TRỰC QUAN: BEFORE VS AFTER CẤU HÌNH PHÂN QUYỀN</text>
  <text x="460" y="68" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#93c5fd" text-anchor="middle">Chia sẻ bừa bãi bị phá nát bài vs Phân quyền đúng người – đúng vai trò an toàn 100%</text>

  <g transform="translate(40, 88)" filter="url(#shadow)">
    <rect width="840" height="344" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Left: Before -->
    <g transform="translate(35, 20)">
      <rect width="365" height="30" rx="8" fill="#ffe4e6" stroke="#f43f5e" stroke-width="1.2"/>
      <text x="182" y="19" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" fill="#be123c" text-anchor="middle">❌ BEFORE: CHIA SẺ BỪA BÃI &amp; MẤT KIỂM SOÁT</text>

      <g transform="translate(15, 42)">
        <rect width="335" height="215" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

        <g transform="translate(16, 16)">
          <rect width="300" height="40" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
          <text x="10" y="24" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#991b1b">🌐 Anyone with the link ➔ Editor</text>

          <g transform="translate(0, 55)" font-family="'Inter', sans-serif" font-size="8.5" fill="#881337" line-height="1.6">
            <text x="0" y="12">• Gửi link vào nhóm Zalo lớp với quyền Chỉnh sửa.</text>
            <text x="0" y="32">• Người lạ bấm vào xóa mất 3 trang kế hoạch trực nhật.</text>
            <text x="0" y="52">• Bạn nghịch ngợm đổi màu chữ toàn bộ bài thành màu vàng.</text>
            <text x="0" y="72">• Xuất hiện hàng chục "Động vật ẩn danh" quậy phá!</text>
          </g>

          <rect x="0" y="140" width="300" height="42" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
          <text x="150" y="158" font-family="'Inter', sans-serif" font-size="8.5" font-weight="800" fill="#9f1239" text-anchor="middle">HẬU QUẢ: MẤT BÀI · KHÔNG BIẾT AI PHÁ</text>
          <text x="150" y="172" font-family="'Inter', sans-serif" font-size="7.5" fill="#881337" text-anchor="middle">Phải mất công tìm lại lịch sử phiên bản để cứu</text>
        </g>
      </g>
      <text x="182" y="285" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#e11d48" text-anchor="middle">Nguy cơ: Mất dữ liệu, rò rỉ thông tin riêng tư</text>
    </g>

    <!-- Right: After -->
    <g transform="translate(440, 20)">
      <rect width="365" height="30" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.2"/>
      <text x="182" y="19" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" fill="#065f46" text-anchor="middle">✓ AFTER: CẤU HÌNH PHÂN QUYỀN CHUẨN MỰC</text>

      <g transform="translate(15, 42)">
        <rect width="335" height="215" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>

        <g transform="translate(16, 16)">
          <rect width="300" height="40" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
          <text x="10" y="24" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#065f46">🔒 Restricted ➔ Phân vai rõ ràng</text>

          <g transform="translate(0, 55)" font-family="'Inter', sans-serif" font-size="8.5" fill="#14532d" line-height="1.6">
            <text x="0" y="12">• <b>Thầy cô:</b> Cấp quyền <b>Viewer</b> (chỉ đọc bài chấm điểm).</text>
            <text x="0" y="32">• <b>Lớp trưởng &amp; Tổ trưởng:</b> Cấp <b>Commenter</b> (góp ý).</text>
            <text x="0" y="52">• <b>Bạn cùng phân công:</b> Cấp <b>Editor</b> (ghi bảng trực nhật).</text>
            <text x="0" y="72">• Khóa quyền tải xuống và sao chép bài làm.</text>
          </g>

          <rect x="0" y="140" width="300" height="42" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
          <text x="150" y="158" font-family="'Inter', sans-serif" font-size="8.5" font-weight="800" fill="#047857" text-anchor="middle">KẾT QUẢ: AN TOÀN TUYỆT ĐỐI 100%</text>
          <text x="150" y="172" font-family="'Inter', sans-serif" font-size="7.5" fill="#15803d" text-anchor="middle">Biết rõ ai làm gì, không sợ bị phá bài hay lộ tài liệu</text>
        </g>
      </g>
      <text x="182" y="285" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" fill="#047857" text-anchor="middle">Đẳng cấp: Thao tác như chuyên gia quản trị đám mây</text>
    </g>
  </g>
</svg>
