<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b263b"/>
    </linearGradient>
    <linearGradient id="commentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#152b47"/>
    </linearGradient>
    <linearGradient id="suggestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#134e4a"/>
      <stop offset="100%" stop-color="#0f3d3a"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#bgGrad)"/>

  <!-- Title Badge -->
  <rect x="280" y="24" width="400" height="42" rx="21" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="480" y="51" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#38bdf8" text-anchor="middle">
    SO SÁNH: COMMENT (BÌNH LUẬN) vs SUGGESTING (ĐỀ XUẤT)
  </text>

  <!-- Left Card: Comment -->
  <g transform="translate(40, 85)" filter="url(#cardShadow)">
    <rect width="420" height="420" rx="16" fill="url(#commentGrad)" stroke="#3b82f6" stroke-width="2"/>
    
    <!-- Header -->
    <rect x="20" y="20" width="48" height="48" rx="12" fill="#2563eb" fill-opacity="0.2"/>
    <path d="M36 34h16c2.2 0 4 1.8 4 4v10c0 2.2-1.8 4-4 4h-10l-6 6v-6h0c-2.2 0-4-1.8-4-4V38c0-2.2 1.8-4 4-4z" fill="#60a5fa"/>
    <text x="80" y="44" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#93c5fd">Comment (Bình luận)</text>
    <text x="80" y="62" font-family="Arial, sans-serif" font-size="12" fill="#bfdbfe">Phím tắt: Ctrl + Alt + M</text>

    <!-- Characteristics -->
    <rect x="24" y="85" width="372" height="110" rx="10" fill="#0f172a" fill-opacity="0.6"/>
    <text x="40" y="112" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">• Bản chất: Ghi chú bên lề tài liệu</text>
    <text x="40" y="136" font-family="Arial, sans-serif" font-size="13" fill="#cbd5e1">✓ Không làm thay đổi trực tiếp câu chữ gốc</text>
    <text x="40" y="158" font-family="Arial, sans-serif" font-size="13" fill="#cbd5e1">✓ Dùng để hỏi, góp ý, khen ngợi, giao việc (@email)</text>
    <text x="40" y="180" font-family="Arial, sans-serif" font-size="13" fill="#cbd5e1">✓ Có thể Reply (trả lời) qua lại nhiều lượt</text>

    <!-- Visual Sample -->
    <rect x="24" y="210" width="372" height="120" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <!-- Thread bubble -->
    <circle cx="50" cy="240" r="14" fill="#3b82f6"/>
    <text x="50" y="245" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">B</text>
    <text x="74" y="238" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Bình (Bạn cùng nhóm)</text>
    <text x="74" y="254" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">10:15 Hôm nay</text>
    <text x="50" y="280" font-family="Arial, sans-serif" font-size="12" fill="#e2e8f0">"Cậu nên ghi rõ địa điểm tập trung ở cổng số 2 nhé!"</text>
    
    <!-- Action tags -->
    <g transform="translate(24, 345)">
      <rect width="175" height="42" rx="8" fill="#1d4ed8" fill-opacity="0.3" stroke="#3b82f6" stroke-width="1"/>
      <text x="87" y="26" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#93c5fd" text-anchor="middle">💬 Reply (Trả lời)</text>
    </g>
    <g transform="translate(220, 345)">
      <rect width="175" height="42" rx="8" fill="#047857" fill-opacity="0.3" stroke="#10b981" stroke-width="1"/>
      <text x="87" y="26" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6ee7b7" text-anchor="middle">✓ Resolve (Đã xử lý)</text>
    </g>
  </g>

  <!-- Right Card: Suggesting -->
  <g transform="translate(500, 85)" filter="url(#cardShadow)">
    <rect width="420" height="420" rx="16" fill="url(#suggestGrad)" stroke="#10b981" stroke-width="2"/>
    
    <!-- Header -->
    <rect x="20" y="20" width="48" height="48" rx="12" fill="#059669" fill-opacity="0.2"/>
    <path d="M34 46l10-10 4 4-10 10-5 1 1-5zm11-11l3-3c.8-.8 2-.8 2.8 0l1.4 1.4c.8.8.8 2 0 2.8l-3 3-4.2-4.2z" fill="#34d399"/>
    <text x="80" y="44" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#a7f3d0">Suggesting (Đề xuất)</text>
    <text x="80" y="62" font-family="Arial, sans-serif" font-size="12" fill="#ccfbf1">Chế độ bút xanh: Bút chì ở góc phải</text>

    <!-- Characteristics -->
    <rect x="24" y="85" width="372" height="110" rx="10" fill="#0f172a" fill-opacity="0.6"/>
    <text x="40" y="112" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34d399">• Bản chất: Trực tiếp thay đổi văn bản</text>
    <text x="40" y="136" font-family="Arial, sans-serif" font-size="13" fill="#cbd5e1">✓ Chữ xóa bị gạch ngang, chữ mới hiện mực xanh lá</text>
    <text x="40" y="158" font-family="Arial, sans-serif" font-size="13" fill="#cbd5e1">✓ Chủ sở hữu (Owner) duyệt hoặc từ chối sửa đổi</text>
    <text x="40" y="180" font-family="Arial, sans-serif" font-size="13" fill="#cbd5e1">✓ An toàn tuyệt đối: Văn bản gốc chưa bị mất ngay</text>

    <!-- Visual Sample -->
    <rect x="24" y="210" width="372" height="120" rx="10" fill="#132e27" stroke="#10b981" stroke-width="1"/>
    <!-- Mock in-text edit -->
    <rect x="36" y="224" width="348" height="36" rx="6" fill="#0b201a"/>
    <text x="46" y="247" font-family="Arial, sans-serif" font-size="13" fill="#94a3b8">Xuất phát lúc </text>
    <text x="130" y="247" font-family="Arial, sans-serif" font-size="13" fill="#ef4444" text-decoration="line-through">9 giờ</text>
    <text x="172" y="247" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#10b981"> 7 giờ 30</text>
    
    <!-- Mini suggestion card -->
    <text x="46" y="285" font-family="Arial, sans-serif" font-size="11" fill="#6ee7b7">Bình đề xuất: Thay thế "9 giờ" bằng "7 giờ 30"</text>
    
    <!-- Action tags -->
    <g transform="translate(24, 345)">
      <rect width="175" height="42" rx="8" fill="#059669" fill-opacity="0.4" stroke="#10b981" stroke-width="1.5"/>
      <text x="87" y="26" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#a7f3d0" text-anchor="middle">✓ Accept (Đồng ý)</text>
    </g>
    <g transform="translate(220, 345)">
      <rect width="175" height="42" rx="8" fill="#dc2626" fill-opacity="0.3" stroke="#f87171" stroke-width="1.5"/>
      <text x="87" y="26" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fca5a5" text-anchor="middle">✕ Reject (Từ chối)</text>
    </g>
  </g>
</svg>
