<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="curBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1e38"/>
    </linearGradient>
    <filter id="floatShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#curBg)"/>

  <!-- Title Badge -->
  <rect x="230" y="20" width="500" height="42" rx="21" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="480" y="47" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#38bdf8" text-anchor="middle">
    ĐỒNG THỜI CỘNG TÁC: MULTIPLE EDITORS &amp; CON TRỎ MÀU
  </text>

  <!-- Document Window Mockup -->
  <g transform="translate(60, 80)" filter="url(#floatShadow)">
    <rect width="840" height="430" rx="14" fill="#ffffff"/>
    
    <!-- App Bar -->
    <rect width="840" height="56" rx="14" fill="#f8fafc"/>
    <rect y="55" width="840" height="1" fill="#e2e8f0"/>
    
    <!-- Doc Title & Icon -->
    <rect x="20" y="14" width="28" height="28" rx="4" fill="#4285f4"/>
    <path d="M28 20h12v3H28zm0 5h12v2H28zm0 4h8v2H28z" fill="#ffffff"/>
    <text x="58" y="27" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Kế hoạch Hội chợ Khoa học THCS 2026</text>
    <text x="58" y="44" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Đã lưu vào Drive • Chỉnh sửa lần cuối cách đây vài giây</text>

    <!-- Top Right Collaborator Avatars -->
    <g transform="translate(560, 12)">
      <!-- Avatar 1: An -->
      <circle cx="20" cy="16" r="16" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
      <text x="20" y="21" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">A</text>
      
      <!-- Avatar 2: Bình -->
      <circle cx="48" cy="16" r="16" fill="#059669" stroke="#ffffff" stroke-width="2"/>
      <text x="48" y="21" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">B</text>

      <!-- Avatar 3: Chi -->
      <circle cx="76" cy="16" r="16" fill="#d97706" stroke="#ffffff" stroke-width="2"/>
      <text x="76" y="21" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">C</text>

      <!-- Avatar 4: Cô Lan (Teacher) -->
      <circle cx="104" cy="16" r="16" fill="#7c3aed" stroke="#ffffff" stroke-width="2"/>
      <text x="104" y="21" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">L</text>

      <!-- Share Button -->
      <rect x="135" y="2" width="115" height="30" rx="15" fill="#1a73e8"/>
      <text x="192" y="21" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">🔒 Chia sẻ (4)</text>
    </g>

    <!-- Document Body -->
    <g transform="translate(60, 85)">
      <text x="0" y="24" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f172a">1. Mục Tiêu Dự Án STEM &amp; Robot Tự Hành</text>
      
      <!-- Paragraph 1 with Blue Cursor (An) -->
      <text x="0" y="60" font-family="Arial, sans-serif" font-size="14" fill="#334155">
        Dự án nhằm giới thiệu các mô hình cánh tay robot và xe dò đường thông minh do học sinh lớp 7 tự chế tạo.
      </text>
      <!-- Cursor An -->
      <line x1="680" y1="46" x2="680" y2="65" stroke="#2563eb" stroke-width="2.5"/>
      <rect x="680" y="32" width="48" height="16" rx="3" fill="#2563eb"/>
      <text x="704" y="44" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">An</text>

      <!-- Paragraph 2 with Green Cursor (Bình) -->
      <text x="0" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">2. Dự Trù Kinh Phí &amp; Thiết Bị Cần Mua</text>
      <text x="0" y="140" font-family="Arial, sans-serif" font-size="14" fill="#334155">
        Bao gồm 02 bộ vi điều khiển Arduino Nano, 04 động cơ servo mini, và pin sạc 18650 dung lượng cao
      </text>
      <!-- Cursor Binh -->
      <line x1="635" y1="126" x2="635" y2="145" stroke="#059669" stroke-width="2.5"/>
      <rect x="635" y="112" width="55" height="16" rx="3" fill="#059669"/>
      <text x="662" y="124" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Bình</text>

      <!-- Paragraph 3 with Purple Teacher Comment (Cô Lan) -->
      <rect x="0" y="170" width="520" height="95" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="16" y="196" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">3. Lịch Trình Thử Nghiệm Trực Tiếp</text>
      <text x="16" y="222" font-family="Arial, sans-serif" font-size="13" fill="#475569">
        Tuần 1: Lắp ráp phần cứng khung xe tại phòng thực hành Tin học.
      </text>
      <text x="16" y="246" font-family="Arial, sans-serif" font-size="13" fill="#475569">
        Tuần 2: Nạp code điều khiển và chạy thử nghiệm trên sa bàn vạch đen.
      </text>

      <!-- Floating Teacher Comment Box -->
      <g transform="translate(540, 160)" filter="url(#floatShadow)">
        <rect width="200" height="110" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
        <circle cx="20" cy="22" r="10" fill="#7c3aed"/>
        <text x="20" y="26" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">L</text>
        <text x="36" y="24" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6d28d9">Cô Lan (GV Hướng dẫn)</text>
        <text x="12" y="48" font-family="Arial, sans-serif" font-size="11" fill="#334155">
          "Nhớ ghi rõ nội quy an toàn pin điện tử và đồ bảo hộ nhé các em!"
        </text>
        <rect x="12" y="78" width="70" height="22" rx="4" fill="#ede9fe"/>
        <text x="47" y="93" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#7c3aed" text-anchor="middle">Trả lời...</text>
      </g>
    </g>

    <!-- Bottom Feature Explainer Bar -->
    <rect x="20" y="380" width="800" height="38" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="35" y="404" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534">
      ⚡ ĐỒNG BỘ THỜI GIAN THỰC (REAL-TIME SYNC):
    </text>
    <text x="280" y="404" font-family="Arial, sans-serif" font-size="12" fill="#15803d">
      Mỗi bạn có con trỏ màu riêng biệt. Không lo ghi đè nội dung của nhau khi phân công rõ ràng!
    </text>
  </g>
</svg>
