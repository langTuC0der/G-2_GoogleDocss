<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="baBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
    <filter id="baShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#baBg)"/>

  <!-- Badge Header -->
  <rect x="250" y="20" width="460" height="42" rx="21" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="480" y="47" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#38bdf8" text-anchor="middle">
    BEFORE &amp; AFTER: CHUYỂN BIẾN NHỜ CỘNG TÁC NHÓM ĐÚNG CÁCH
  </text>

  <!-- Left Side: BEFORE -->
  <g transform="translate(40, 85)" filter="url(#baShadow)">
    <rect width="420" height="420" rx="14" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
    
    <!-- Top banner -->
    <rect width="420" height="44" rx="14" fill="#fee2e2"/>
    <text x="20" y="28" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#b91c1c">❌ BEFORE: Làm việc đơn độc / Sửa đè ẩu</text>

    <!-- Content -->
    <g transform="translate(24, 65)">
      <text x="0" y="22" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Kế hoạch tham quan làng gốm Bát Tràng</text>
      <text x="0" y="48" font-family="Arial, sans-serif" font-size="12" fill="#64748b">• Tác giả: 1 bạn tự gõ vội, không ai xem lại</text>
      
      <!-- Mock text block with flaws -->
      <rect x="0" y="65" width="372" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="14" y="90" font-family="Arial, sans-serif" font-size="12" fill="#334155">"Lớp mình sẽ đi tham quan vào Chủ nhật. Đi lúc 9 giờ.</text>
      <text x="14" y="112" font-family="Arial, sans-serif" font-size="12" fill="#334155">Ai đi thì đăng ký với lớp trưởng. Tiền ăn trưa tự túc."</text>
      <text x="14" y="145" font-family="Arial, sans-serif" font-size="11" fill="#dc2626">⚠ Không rõ ngày nào, tháng nào!</text>
      <text x="14" y="165" font-family="Arial, sans-serif" font-size="11" fill="#dc2626">⚠ Giờ xuất phát quá muộn, trời nắng gắt!</text>
      <text x="14" y="185" font-family="Arial, sans-serif" font-size="11" fill="#dc2626">⚠ Bạn khác bực mình vào xóa bừa, làm mất bài gốc!</text>

      <!-- Flaw list -->
      <rect x="0" y="235" width="372" height="105" rx="8" fill="#fef2f2"/>
      <text x="14" y="260" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#991b1b">Hậu quả khi không dùng Comment / Suggesting:</text>
      <text x="14" y="282" font-family="Arial, sans-serif" font-size="11" fill="#b91c1c">✖ Tự ý xóa bài của nhau gây cãi vã, mất hòa khí</text>
      <text x="14" y="302" font-family="Arial, sans-serif" font-size="11" fill="#b91c1c">✖ Không biết ai vừa xóa đoạn quan trọng, hoảng loạn</text>
      <text x="14" y="322" font-family="Arial, sans-serif" font-size="11" fill="#b91c1c">✖ Kế hoạch sơ sài, thiếu an toàn và thiếu chuyên nghiệp</text>
    </g>
  </g>

  <!-- Right Side: AFTER -->
  <g transform="translate(500, 85)" filter="url(#baShadow)">
    <rect width="420" height="420" rx="14" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    
    <!-- Top banner -->
    <rect width="420" height="44" rx="14" fill="#d1fae5"/>
    <text x="20" y="28" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#065f46">✔ AFTER: Cộng tác văn minh, đa chiều &amp; an toàn</text>

    <!-- Content -->
    <g transform="translate(24, 65)">
      <text x="0" y="22" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0f172a">Kế hoạch tham quan Làng gốm Bát Tràng</text>
      <text x="0" y="48" font-family="Arial, sans-serif" font-size="12" fill="#059669">• 4 thành viên cùng hoàn thiện, lịch sử lưu tự động</text>

      <!-- Mock text block with Suggestions & Comments -->
      <rect x="0" y="65" width="372" height="150" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="14" y="90" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">"Lớp mình sẽ đi tham quan vào Chủ nhật </text>
      <text x="250" y="90" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#059669">(ngày 28/11)"</text>
      
      <!-- Suggestion inline highlight -->
      <text x="14" y="112" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Xuất phát lúc </text>
      <text x="94" y="112" font-family="Arial, sans-serif" font-size="12" fill="#dc2626" text-decoration="line-through">9 giờ</text>
      <text x="135" y="112" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#059669">07:30 sáng</text>
      
      <!-- Mini Comment chip -->
      <rect x="14" y="130" width="344" height="40" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="24" y="146" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8">💬 Bình: Đề xuất đi sớm tránh kẹt xe và nắng gắt!</text>
      <text x="24" y="162" font-family="Arial, sans-serif" font-size="10" fill="#047857">✔ An (Owner) đã bấm ĐỒNG Ý (Accept)</text>

      <!-- Benefits list -->
      <rect x="0" y="235" width="372" height="105" rx="8" fill="#f0fdf4"/>
      <text x="14" y="260" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534">Ưu thế vượt trội của kỹ năng Buổi 10:</text>
      <text x="14" y="282" font-family="Arial, sans-serif" font-size="11" fill="#15803d">✔ Tôn trọng bài bạn: Góp ý qua Comment &amp; Suggesting</text>
      <text x="14" y="302" font-family="Arial, sans-serif" font-size="11" fill="#15803d">✔ Lịch sử phiên bản minh bạch: Ai sửa gì đều có bằng chứng</text>
      <text x="14" y="322" font-family="Arial, sans-serif" font-size="11" fill="#15803d">✔ An tâm tuyệt đối: Luôn khôi phục được bản cũ khi cần!</text>
    </g>
  </g>
</svg>
