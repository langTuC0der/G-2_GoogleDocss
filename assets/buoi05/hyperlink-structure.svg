<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b152d"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="460" rx="20" fill="url(#bgGrad3)"/>

  <!-- Title & Subtitle -->
  <text x="460" y="44" font-family="'Outfit', sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">CẤU TRÚC SIÊU LIÊN KẾT (HYPERLINK) &amp; PHÍM TẮT CTRL + K</text>
  <text x="460" y="70" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#93c5fd" text-anchor="middle">Biến những dòng URL dài ngoằng, rối mắt thành những nút bấm văn bản tinh tế, chuyên nghiệp</text>

  <!-- Big Central Interactive Dialog Representation -->
  <g transform="translate(60, 95)" filter="url(#shadow3)">
    <!-- Google Docs Insert Link Dialog Box Mockup -->
    <rect width="800" height="200" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <!-- Dialog Header -->
    <rect x="0" y="0" width="800" height="42" rx="14" fill="#f8fafc"/>
    <circle cx="24" cy="21" r="5" fill="#ef4444"/>
    <circle cx="42" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="21" r="5" fill="#10b981"/>
    <text x="400" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Hộp thoại Chèn liên kết trong Google Docs (Insert Link — Ctrl + K)</text>

    <!-- Field 1: Text to display -->
    <g transform="translate(40, 58)">
      <text x="0" y="16" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#1e293b">1. Văn bản hiển thị (Text):</text>
      <rect x="0" y="24" width="720" height="38" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
      <text x="16" y="49" font-family="'Inter', sans-serif" font-size="13.5" font-weight="700" fill="#1d4ed8">Tìm hiểu thêm về Vườn Quốc Gia Cúc Phương ↗</text>
      <rect x="580" y="28" width="130" height="30" rx="6" fill="#dbeafe"/>
      <text x="645" y="48" font-family="'Inter', sans-serif" font-size="10.5" font-weight="800" fill="#1e40af" text-anchor="middle">MẮT NGƯỜI ĐỌC THẤY</text>
    </g>

    <!-- Field 2: Link destination -->
    <g transform="translate(40, 126)">
      <text x="0" y="16" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#1e293b">2. Đường dẫn đích (Link URL):</text>
      <rect x="0" y="24" width="720" height="38" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="16" y="48" font-family="'Consolas', 'Courier New', monospace" font-size="12" font-weight="600" fill="#059669">https://vi.wikipedia.org/wiki/V%C6%B0%E1%BB%9Dn_qu%E1%BB%91c_gia_C%C3%BAc_Ph%C6%B0%C6%A1ng</text>
      <rect x="580" y="28" width="130" height="30" rx="6" fill="#ecfdf5"/>
      <text x="645" y="48" font-family="'Inter', sans-serif" font-size="10.5" font-weight="800" fill="#047857" text-anchor="middle">MÁY TÍNH DẪN TỚI</text>
    </g>
  </g>

  <!-- Bottom Comparison: Ugly Raw Link vs Elegant Hyperlink -->
  <g transform="translate(60, 315)">
    <!-- Bad Example -->
    <rect x="0" y="0" width="385" height="115" rx="12" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5"/>
    <text x="18" y="26" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#dc2626">❌ LỖI TRÌNH BÀY: DÁN LINK TRẦN THÔ THIỂN</text>
    <text x="18" y="52" font-family="'Inter', sans-serif" font-size="11.5" font-weight="500" fill="#475569">Rừng Cúc Phương rất đẹp. Xem tại:</text>
    <text x="18" y="74" font-family="'Consolas', monospace" font-size="10" font-weight="600" fill="#9f1239">https://vi.wikipedia.org/wiki/V%C6%B0%E1%BB%9Dn...</text>
    <text x="18" y="98" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#b91c1c">⚠️ Dài dòng, lộn xộn, làm vỡ khung tài liệu!</text>

    <!-- Good Example -->
    <rect x="415" y="0" width="385" height="115" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="433" y="26" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#059669">✓ ĐẠT CHUẨN: CHÈN HYPERLINK GỌN GÀNG</text>
    <text x="433" y="52" font-family="'Inter', sans-serif" font-size="11.5" font-weight="500" fill="#475569">Rừng Cúc Phương rất đẹp. Em có thể đọc thêm tại</text>
    <text x="433" y="74" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#2563eb" text-decoration="underline">bách khoa toàn thư Wikipedia ↗</text>
    <text x="433" y="98" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#047857">✨ Đẹp mắt, chuyên nghiệp, người đọc dễ bấm!</text>
  </g>
</svg>
