<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAdj" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b152d"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="shadowAdj" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="460" rx="20" fill="url(#bgAdj)"/>

  <!-- Title & Subtitle -->
  <text x="460" y="44" font-family="'Outfit', sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">TÙY CHỌN HÌNH ẢNH NÂNG CAO (IMAGE OPTIONS)</text>
  <text x="460" y="70" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#c7d2fe" text-anchor="middle">Đổi tông màu nghệ thuật (Recolor) và tinh chỉnh độ mờ trong suốt (Transparency)</text>

  <!-- Left: Recolor palettes -->
  <g transform="translate(45, 95)" filter="url(#shadowAdj)">
    <rect width="405" height="325" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="405" height="48" rx="16" fill="#f8fafc"/>
    <text x="202" y="30" font-family="'Outfit', sans-serif" font-size="14.5" font-weight="800" fill="#1e293b" text-anchor="middle">1. Đổi màu ảnh nghệ thuật (Recolor)</text>

    <!-- Grid of 4 Recolor samples -->
    <g transform="translate(25, 65)">
      <!-- Original -->
      <g transform="translate(0, 0)">
        <rect width="165" height="95" rx="8" fill="#e0f2fe" stroke="#38bdf8"/>
        <circle cx="82" cy="42" r="22" fill="#0284c7"/>
        <text x="82" y="78" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#0369a1" text-anchor="middle">Gốc: Đầy đủ màu</text>
      </g>
      <!-- Grayscale / Black & White -->
      <g transform="translate(190, 0)">
        <rect width="165" height="95" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
        <circle cx="82" cy="42" r="22" fill="#475569"/>
        <text x="82" y="78" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">Đơn sắc (Trắng đen)</text>
      </g>
      <!-- Sepia Warm -->
      <g transform="translate(0, 115)">
        <rect width="165" height="95" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
        <circle cx="82" cy="42" r="22" fill="#b45309"/>
        <text x="82" y="78" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#78350f" text-anchor="middle">Tông ấm (Sepia cổ điển)</text>
      </g>
      <!-- Cyan Cool -->
      <g transform="translate(190, 115)">
        <rect width="165" height="95" rx="8" fill="#ecfeff" stroke="#06b6d4"/>
        <circle cx="82" cy="42" r="22" fill="#0891b2"/>
        <text x="82" y="78" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#155e75" text-anchor="middle">Tông lạnh (Cyan hiện đại)</text>
      </g>
    </g>

    <text x="202" y="305" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Hơn 20 bộ lọc màu có sẵn trong bảng Tùy chọn hình ảnh</text>
  </g>

  <!-- Right: Sliders (Transparency, Brightness, Contrast) -->
  <g transform="translate(470, 95)" filter="url(#shadowAdj)">
    <rect width="405" height="325" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="405" height="48" rx="16" fill="#f8fafc"/>
    <text x="202" y="30" font-family="'Outfit', sans-serif" font-size="14.5" font-weight="800" fill="#1e293b" text-anchor="middle">2. Thanh trượt Độ mờ &amp; Ánh sáng (Adjustments)</text>

    <g transform="translate(25, 65)">
      <!-- Slider 1: Transparency -->
      <text x="0" y="16" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#0f172a">Độ trong suốt (Transparency):</text>
      <text x="320" y="16" font-family="'Inter', sans-serif" font-size="11.5" font-weight="800" fill="#2563eb">65%</text>
      <rect x="0" y="26" width="355" height="8" rx="4" fill="#e2e8f0"/>
      <rect x="0" y="26" width="230" height="8" rx="4" fill="#3b82f6"/>
      <circle cx="230" cy="30" r="10" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="48" font-family="'Inter', sans-serif" font-size="10.5" font-weight="500" fill="#059669">💡 Tăng độ trong suốt để làm ảnh mờ chìm làm hình nền (Watermark)</text>

      <!-- Slider 2: Brightness -->
      <g transform="translate(0, 60)">
        <text x="0" y="16" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#0f172a">Độ sáng (Brightness):</text>
        <text x="320" y="16" font-family="'Inter', sans-serif" font-size="11.5" font-weight="800" fill="#f59e0b">+15%</text>
        <rect x="0" y="26" width="355" height="8" rx="4" fill="#e2e8f0"/>
        <rect x="0" y="26" width="205" height="8" rx="4" fill="#fbbf24"/>
        <circle cx="205" cy="30" r="10" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
      </g>

      <!-- Slider 3: Contrast -->
      <g transform="translate(0, 120)">
        <text x="0" y="16" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#0f172a">Độ tương phản (Contrast):</text>
        <text x="320" y="16" font-family="'Inter', sans-serif" font-size="11.5" font-weight="800" fill="#7c3aed">+20%</text>
        <rect x="0" y="26" width="355" height="8" rx="4" fill="#e2e8f0"/>
        <rect x="0" y="26" width="220" height="8" rx="4" fill="#8b5cf6"/>
        <circle cx="220" cy="30" r="10" fill="#7c3aed" stroke="#ffffff" stroke-width="2"/>
      </g>
    </g>

    <!-- Reset Button tip -->
    <rect x="25" y="245" width="355" height="60" rx="10" fill="#fef2f2" stroke="#fecdd3"/>
    <text x="40" y="268" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#dc2626">↺ Nút Cứu Nguy: Đặt lại (Reset)</text>
    <text x="40" y="288" font-family="'Inter', sans-serif" font-size="10.5" font-weight="500" fill="#991b1b">Nếu lỡ kéo màu quá đà khiến ảnh xấu, bấm Đặt lại để khôi phục ảnh gốc.</text>
  </g>
</svg>
