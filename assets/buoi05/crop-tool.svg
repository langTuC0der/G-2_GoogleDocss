<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCrop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b152d"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadowCrop" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="460" rx="20" fill="url(#bgCrop)"/>

  <!-- Title & Subtitle -->
  <text x="460" y="44" font-family="'Outfit', sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">CÔNG CỤ CẮT CÚP HÌNH ẢNH (CROP IMAGE) TRONG GOOGLE DOCS</text>
  <text x="460" y="70" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#93c5fd" text-anchor="middle">Loại bỏ chi tiết thừa, lấy nét vào chủ thể chính và hoàn tất bằng phím Enter</text>

  <!-- Step 1: Crop Icon on Toolbar -->
  <g transform="translate(45, 95)" filter="url(#shadowCrop)">
    <rect width="390" height="325" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="390" height="48" rx="16" fill="#f8fafc"/>
    <text x="195" y="30" font-family="'Outfit', sans-serif" font-size="14.5" font-weight="800" fill="#1e293b" text-anchor="middle">1. Nút Cắt ảnh trên Thanh công cụ</text>

    <!-- Toolbar mockup -->
    <rect x="25" y="65" width="340" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <!-- Icon Crop Highlighted -->
    <rect x="145" y="70" width="50" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <path d="M 160 78 L 160 94 L 176 94 M 180 90 L 164 90 M 176 86 L 176 74" stroke="#1d4ed8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="195" y="125" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#2563eb" text-anchor="middle">Biểu tượng Crop (Hai góc thước đan chéo)</text>

    <!-- Hotkey / Double Click Tip -->
    <rect x="25" y="145" width="340" height="155" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="40" y="172" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#1e40af">⚡ 2 Cách kích hoạt nhanh:</text>
    <text x="40" y="196" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#1e3a8a">Cách 1: Nhấp đúp chuột trái (Double-click) vào ảnh</text>
    <text x="40" y="214" font-family="'Inter', sans-serif" font-size="10.5" font-weight="400" fill="#475569">Cách nhanh nhất mà các chuyên gia thiết kế hay dùng!</text>
    <text x="40" y="240" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#1e3a8a">Cách 2: Nhấp chọn ảnh → Bấm icon Cắt ảnh ở trên</text>
    <text x="40" y="258" font-family="'Inter', sans-serif" font-size="10.5" font-weight="400" fill="#475569">Biểu tượng nằm ngay cạnh công cụ Màu viền ảnh.</text>
    <text x="40" y="284" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#10b981">✓ Ảnh gốc không hề bị xóa mất vĩnh viễn!</text>
  </g>

  <!-- Step 2: Crop Marks in Action -->
  <g transform="translate(485, 95)" filter="url(#shadowCrop)">
    <rect width="390" height="325" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="390" height="48" rx="16" fill="#f8fafc"/>
    <text x="195" y="30" font-family="'Outfit', sans-serif" font-size="14.5" font-weight="800" fill="#1e293b" text-anchor="middle">2. Kéo vạch đen &amp; Nhấn phím ENTER</text>

    <!-- Crop Canvas -->
    <rect x="35" y="65" width="320" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    
    <!-- Shaded Out Area (To be removed) -->
    <rect x="50" y="75" width="290" height="130" fill="#94a3b8" opacity="0.4"/>
    <text x="100" y="100" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#475569">Phần mờ sẽ bị ẩn</text>

    <!-- Active Kept Area -->
    <rect x="110" y="85" width="180" height="110" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <circle cx="200" cy="140" r="30" fill="#38bdf8"/>
    <text x="200" y="145" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">CHỦ THỂ CHÍNH</text>

    <!-- Heavy Black Crop Marks -->
    <!-- Top-Left Corner Mark -->
    <path d="M 110 97 L 110 85 L 122 85" stroke="#000000" stroke-width="5" stroke-linecap="square" fill="none"/>
    <!-- Top-Right Corner Mark -->
    <path d="M 278 85 L 290 85 L 290 97" stroke="#000000" stroke-width="5" stroke-linecap="square" fill="none"/>
    <!-- Bottom-Left Corner Mark -->
    <path d="M 110 183 L 110 195 L 122 195" stroke="#000000" stroke-width="5" stroke-linecap="square" fill="none"/>
    <!-- Bottom-Right Corner Mark -->
    <path d="M 278 195 L 290 195 L 290 183" stroke="#000000" stroke-width="5" stroke-linecap="square" fill="none"/>
    <!-- Mid Top Mark -->
    <line x1="192" y1="85" x2="208" y2="85" stroke="#000000" stroke-width="5"/>
    <!-- Mid Bottom Mark -->
    <line x1="192" y1="195" x2="208" y2="195" stroke="#000000" stroke-width="5"/>

    <!-- Confirmation instructions -->
    <rect x="25" y="230" width="340" height="75" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="40" y="254" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#15803d">🎯 Bước hoàn tất quan trọng:</text>
    <text x="40" y="274" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#14532d">• Kéo các vạch đen dày để chọn khung hình ưng ý.</text>
    <text x="40" y="293" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#047857">• Bấm phím ENTER hoặc click ra ngoài vùng trống để áp dụng!</text>
  </g>
</svg>
