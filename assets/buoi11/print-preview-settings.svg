<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="printBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
    <filter id="printShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#printBg)"/>

  <!-- Title Badge -->
  <rect x="250" y="20" width="460" height="42" rx="21" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="480" y="47" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#38bdf8" text-anchor="middle">
    IN ẤN &amp; XUẤT BẢN CHUẨN XÁC: PRINT &amp; PRINT PREVIEW
  </text>

  <!-- Left: Print Preview Sheet Mockup -->
  <g transform="translate(60, 85)" filter="url(#printShadow)">
    <rect width="450" height="425" rx="14" fill="#334155"/>
    
    <!-- Paper Sheet (A4 ratio) -->
    <rect x="75" y="25" width="300" height="375" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    
    <!-- Page Header on paper -->
    <text x="95" y="52" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8">Báo cáo Khoa học Tự nhiên · Nhóm 3</text>
    <line x1="95" y1="58" x2="355" y2="58" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Content mock lines -->
    <text x="95" y="85" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">TÌM HIỂU HỆ MẶT TRỜI</text>
    
    <rect x="95" y="100" width="120" height="80" rx="4" fill="#dbeafe"/>
    <circle cx="155" cy="140" r="22" fill="#2563eb"/>
    <text x="155" y="144" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">Hình minh họa</text>

    <!-- Side paragraphs -->
    <rect x="225" y="102" width="130" height="6" rx="2" fill="#94a3b8"/>
    <rect x="225" y="115" width="120" height="6" rx="2" fill="#cbd5e1"/>
    <rect x="225" y="128" width="130" height="6" rx="2" fill="#cbd5e1"/>
    <rect x="225" y="141" width="110" height="6" rx="2" fill="#cbd5e1"/>
    <rect x="225" y="154" width="125" height="6" rx="2" fill="#cbd5e1"/>
    <rect x="225" y="167" width="90" height="6" rx="2" fill="#cbd5e1"/>

    <!-- Paragraphs below -->
    <rect x="95" y="195" width="260" height="6" rx="2" fill="#64748b"/>
    <rect x="95" y="210" width="250" height="6" rx="2" fill="#94a3b8"/>
    <rect x="95" y="225" width="260" height="6" rx="2" fill="#cbd5e1"/>
    <rect x="95" y="240" width="230" height="6" rx="2" fill="#cbd5e1"/>

    <!-- Table mock on paper -->
    <rect x="95" y="265" width="260" height="90" rx="3" fill="#f8fafc" stroke="#cbd5e1"/>
    <line x1="95" y1="285" x2="355" y2="285" stroke="#cbd5e1"/>
    <line x1="180" y1="265" x2="180" y2="355" stroke="#cbd5e1"/>
    <line x1="265" y1="265" x2="265" y2="355" stroke="#cbd5e1"/>
    <text x="105" y="280" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#334155">Hành tinh</text>
    <text x="190" y="280" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#334155">Khoảng cách</text>
    <text x="275" y="280" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#334155">Số vệ tinh</text>

    <!-- Page Footer on paper -->
    <line x1="95" y1="375" x2="355" y2="375" stroke="#e2e8f0" stroke-width="1"/>
    <text x="225" y="388" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Trang 1 / 4</text>
  </g>

  <!-- Right: Print Settings Panel -->
  <g transform="translate(540, 85)" filter="url(#printShadow)">
    <rect width="360" height="425" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    
    <text x="24" y="36" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Cài Đặt In (Ctrl + P)</text>
    <line x1="24" y1="52" x2="336" y2="52" stroke="#334155" stroke-width="1"/>

    <!-- Setting 1: Destination -->
    <text x="24" y="78" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Máy in đích (Destination):</text>
    <rect x="24" y="88" width="312" height="36" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="36" y="111" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">💾 Lưu dưới dạng PDF (Save as PDF)</text>

    <!-- Setting 2: Pages -->
    <text x="24" y="148" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Số trang (Pages):</text>
    <rect x="24" y="158" width="312" height="36" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="36" y="181" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">Tất cả (All) • 4 trang</text>

    <!-- Setting 3: Paper Size -->
    <text x="24" y="218" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Khổ giấy (Paper Size):</text>
    <rect x="24" y="228" width="312" height="36" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="36" y="251" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#22c55e">A4 (210 x 297 mm) — Chuẩn Việt Nam</text>

    <!-- Setting 4: Margins -->
    <text x="24" y="288" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Lề trang (Margins):</text>
    <rect x="24" y="298" width="312" height="36" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="36" y="321" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">Mặc định (Default) / Tối thiểu (Minimum)</text>

    <!-- Action Buttons -->
    <rect x="24" y="360" width="150" height="42" rx="8" fill="#1a73e8"/>
    <text x="99" y="386" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">In / Lưu PDF</text>

    <rect x="186" y="360" width="150" height="42" rx="8" fill="#334155"/>
    <text x="261" y="386" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#cbd5e1" text-anchor="middle">Hủy bỏ</text>
  </g>
</svg>
