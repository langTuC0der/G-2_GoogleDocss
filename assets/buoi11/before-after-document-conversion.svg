<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="badcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
    <filter id="convShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#badcBg)"/>

  <!-- Badge Header -->
  <rect x="230" y="20" width="500" height="42" rx="21" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="480" y="47" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#38bdf8" text-anchor="middle">
    BEFORE &amp; AFTER: CHUYỂN ĐỔI ĐA ĐỊNH DẠNG &amp; XUẤT BẢN PDF
  </text>

  <!-- Left Side: BEFORE -->
  <g transform="translate(40, 85)" filter="url(#convShadow)">
    <rect width="420" height="420" rx="14" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
    
    <!-- Top banner -->
    <rect width="420" height="44" rx="14" fill="#fee2e2"/>
    <text x="20" y="28" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#b91c1c">❌ BEFORE: Bế tắc với file Word truyền thống</text>

    <!-- Content -->
    <g transform="translate(24, 65)">
      <text x="0" y="22" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">baitap.docx (Chỉ mở được trên 1 máy tính)</text>
      <text x="0" y="48" font-family="Arial, sans-serif" font-size="12" fill="#64748b">• File lưu ở ổ C, quên mang USB là không có bài</text>
      
      <!-- Flawed representation -->
      <rect x="0" y="65" width="372" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="14" y="90" font-family="Arial, sans-serif" font-size="12" fill="#334155">"Báo cáo sinh học... máy khác mở ra bị lỗi font chữ!"</text>
      <text x="14" y="112" font-family="Arial, sans-serif" font-size="12" fill="#dc2626">Lỗi font:    khng đc đc</text>
      <text x="14" y="145" font-family="Arial, sans-serif" font-size="11" fill="#dc2626">⚠ Không biết bài dài bao nhiêu từ để nộp theo yêu cầu</text>
      <text x="14" y="165" font-family="Arial, sans-serif" font-size="11" fill="#dc2626">⚠ Gửi file Word cho thầy cô thì bị nhảy trang, lệch ảnh</text>
      <text x="14" y="185" font-family="Arial, sans-serif" font-size="11" fill="#dc2626">⚠ Gõ bàn phím mỏi tay hàng giờ không biết tính năng Voice</text>

      <!-- Flaw list -->
      <rect x="0" y="235" width="372" height="105" rx="8" fill="#fef2f2"/>
      <text x="14" y="260" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#991b1b">Hạn chế lớn khi chỉ dùng phần mềm offline:</text>
      <text x="14" y="282" font-family="Arial, sans-serif" font-size="11" fill="#b91c1c">✖ Không thể cùng làm nhóm từ xa với bạn bè</text>
      <text x="14" y="302" font-family="Arial, sans-serif" font-size="11" fill="#b91c1c">✖ Rủi ro mất trắng bài khi máy tính sập nguồn bất ngờ</text>
      <text x="14" y="322" font-family="Arial, sans-serif" font-size="11" fill="#b91c1c">✖ Không có công cụ kiểm tra số từ, sửa lỗi chính tả</text>
    </g>
  </g>

  <!-- Right Side: AFTER -->
  <g transform="translate(500, 85)" filter="url(#convShadow)">
    <rect width="420" height="420" rx="14" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    
    <!-- Top banner -->
    <rect width="420" height="44" rx="14" fill="#d1fae5"/>
    <text x="20" y="28" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#065f46">✔ AFTER: Linh hoạt Đa nền tảng &amp; Chuẩn PDF</text>

    <!-- Content -->
    <g transform="translate(24, 65)">
      <text x="0" y="22" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0f172a">Chu trình: DOCX ➔ Docs Cloud ➔ PDF In Ấn</text>
      <text x="0" y="48" font-family="Arial, sans-serif" font-size="12" fill="#059669">• Tự do làm bài trên điện thoại, máy tính bảng, PC</text>

      <!-- Ideal document card -->
      <rect x="0" y="65" width="372" height="150" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="14" y="90" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">"Báo cáo Sinh học 7: Đa dạng thế giới động vật"</text>
      <text x="14" y="112" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2563eb">✓ Nhập liệu thần tốc bằng giọng nói Voice Typing (Ctrl+Shift+S)</text>
      
      <!-- Feature bullets -->
      <text x="14" y="140" font-family="Arial, sans-serif" font-size="11" fill="#15803d">✓ Đếm chính xác: 850 từ / chuẩn 3 trang A4 (Ctrl+Shift+C)</text>
      <text x="14" y="160" font-family="Arial, sans-serif" font-size="11" fill="#15803d">✓ Soát sạch lỗi chính tả tiếng Việt tự động</text>
      <text x="14" y="180" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">✓ Xuất PDF hoàn hảo: 100% không bị nhảy dòng, lệch ảnh!</text>

      <!-- Benefits list -->
      <rect x="0" y="235" width="372" height="105" rx="8" fill="#f0fdf4"/>
      <text x="14" y="260" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534">Giá trị học sinh nhận được ở Buổi 11:</text>
      <text x="14" y="282" font-family="Arial, sans-serif" font-size="11" fill="#15803d">✔ Tự tin chuyển đổi mọi file Word thầy cô gửi qua Docs</text>
      <text x="14" y="302" font-family="Arial, sans-serif" font-size="11" fill="#15803d">✔ Nộp file PDF chuyên nghiệp đạt chuẩn báo cáo học sinh giỏi</text>
      <text x="14" y="322" font-family="Arial, sans-serif" font-size="11" fill="#15803d">✔ Tận dụng Voice Typing và Add-ons gia tăng năng suất gấp 3</text>
    </g>
  </g>
</svg>
