<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="ecoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#172a45"/>
    </linearGradient>
    <filter id="glowCard">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#ecoBg)"/>

  <!-- Top Badge -->
  <rect x="250" y="20" width="460" height="42" rx="21" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="480" y="47" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#38bdf8" text-anchor="middle">
    HỆ SINH THÁI ĐỊNH DẠNG: WORD ➔ DOCS ➔ PDF
  </text>

  <!-- Left Station: Microsoft Word (.DOCX) -->
  <g transform="translate(60, 100)" filter="url(#glowCard)">
    <rect width="240" height="360" rx="16" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
    <!-- Word Icon -->
    <rect x="30" y="30" width="60" height="60" rx="12" fill="#2563eb"/>
    <text x="60" y="72" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">W</text>
    
    <text x="30" y="130" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Microsoft Word</text>
    <text x="30" y="152" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#93c5fd">Định dạng: .DOCX</text>

    <!-- Characteristics -->
    <rect x="20" y="175" width="200" height="150" rx="10" fill="#0f172a" fill-opacity="0.6"/>
    <text x="32" y="205" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">• Chuẩn tài liệu máy tính bàn</text>
    <text x="32" y="232" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">• Cần lưu file vào ổ cứng (Ctrl+S)</text>
    <text x="32" y="260" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">• Tương thích tuyệt đối với Docs</text>
    <text x="32" y="295" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#60a5fa">➔ Upload lên Google Drive</text>
  </g>

  <!-- Center Arrow 1: Upload & Open -->
  <g transform="translate(315, 230)">
    <line x1="0" y1="20" x2="65" y2="20" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4"/>
    <polygon points="65,13 80,20 65,27" fill="#38bdf8"/>
    <text x="40" y="5" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#7dd3fc" text-anchor="middle">Tải lên</text>
    <text x="40" y="45" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Mở bằng Docs</text>
  </g>

  <!-- Center Station: Google Docs (Hub) -->
  <g transform="translate(395, 80)" filter="url(#glowCard)">
    <rect width="250" height="400" rx="18" fill="#065f46" stroke="#10b981" stroke-width="2.5"/>
    
    <!-- Docs Icon -->
    <rect x="35" y="30" width="60" height="60" rx="12" fill="#10b981"/>
    <path d="M50 48h22v4H50zm0 8h22v3H50zm0 7h15v3H50z" fill="#ffffff"/>
    <text x="35" y="130" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Google Docs</text>
    <text x="35" y="152" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#a7f3d0">Đám Mây Thông Minh</text>

    <!-- Characteristics -->
    <rect x="20" y="175" width="210" height="190" rx="10" fill="#022c22" fill-opacity="0.7"/>
    <text x="32" y="205" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">• Tự động lưu từng giây</text>
    <text x="32" y="232" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">• Cộng tác cùng lúc nhiều người</text>
    <text x="32" y="260" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">• Nhập bằng giọng nói (Voice)</text>
    <text x="32" y="288" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">• Chuyển đổi qua lại 2 chiều</text>
    <text x="32" y="335" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34d399">➔ Trung tâm xử lý văn bản</text>
  </g>

  <!-- Center Arrow 2: Download / Export -->
  <g transform="translate(660, 230)">
    <line x1="0" y1="20" x2="65" y2="20" stroke="#f87171" stroke-width="3" stroke-dasharray="6,4"/>
    <polygon points="65,13 80,20 65,27" fill="#f87171"/>
    <text x="40" y="5" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fca5a5" text-anchor="middle">Tải xuống</text>
    <text x="40" y="45" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">File ➔ Tải xuống</text>
  </g>

  <!-- Right Station: Adobe PDF (.PDF) -->
  <g transform="translate(740, 100)" filter="url(#glowCard)">
    <rect width="180" height="360" rx="16" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
    <!-- PDF Icon -->
    <rect x="25" y="30" width="55" height="55" rx="12" fill="#dc2626"/>
    <text x="52" y="68" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">PDF</text>
    
    <text x="25" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Bản In PDF</text>
    <text x="25" y="152" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fca5a5">Định dạng: .PDF</text>

    <!-- Characteristics -->
    <rect x="15" y="175" width="150" height="150" rx="10" fill="#450a0a" fill-opacity="0.6"/>
    <text x="24" y="205" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Cố định định dạng 100%</text>
    <text x="24" y="232" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Không bị xô lệch font chữ</text>
    <text x="24" y="260" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Lý tưởng nộp bài, in ấn</text>
    <text x="24" y="295" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f87171">➔ Chuẩn nộp bài thi THCS</text>
  </g>

  <!-- Bottom Comparison Strip -->
  <rect x="60" y="485" width="860" height="36" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="80" y="508" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">💡 QUY TẮC VÀNG THCS:</text>
  <text x="260" y="508" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">Soạn thảo &amp; làm việc nhóm trên Google Docs ➔ Xuất file PDF gửi thầy cô để không bao giờ bị nhảy trang!</text>
</svg>
