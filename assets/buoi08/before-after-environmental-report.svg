<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b152d"/>
      <stop offset="100%" stop-color="#162a54"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="460" rx="20" fill="url(#bgGrad)"/>

  <!-- Title & Subtitle -->
  <text x="460" y="42" font-family="'Outfit', sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">SO SÁNH TRỰC QUAN: BEFORE VS AFTER BÁO CÁO MÔI TRƯỜNG</text>
  <text x="460" y="68" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#93c5fd" text-anchor="middle">Từ báo cáo 3 trang cuộn chuột thủ công ➔ Ấn phẩm khoa học có Document Outline &amp; Mục lục tự động</text>

  <!-- Main Container Card -->
  <g transform="translate(40, 88)" filter="url(#shadow)">
    <rect width="840" height="344" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Left: Before (The Manual Mess) -->
    <g transform="translate(35, 20)">
      <rect width="365" height="30" rx="8" fill="#ffe4e6" stroke="#f43f5e" stroke-width="1.2"/>
      <text x="182" y="19" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" fill="#be123c" text-anchor="middle">❌ BEFORE: GÕ TAY MỤC LỤC &amp; DẤU CHẤM</text>

      <g transform="translate(15, 42)">
        <rect width="335" height="215" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
        
        <!-- Left empty outline -->
        <rect x="10" y="10" width="70" height="195" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
        <text x="45" y="30" font-family="'Inter', sans-serif" font-size="7.5" font-weight="800" fill="#dc2626" text-anchor="middle">OUTLINE</text>
        <text x="45" y="55" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#dc2626" text-anchor="middle">Trống trơn!</text>
        <text x="45" y="70" font-family="'Inter', sans-serif" font-size="7" font-weight="500" fill="#ef4444" text-anchor="middle">(Không Heading)</text>

        <!-- Right document area with jagged manual dots -->
        <g transform="translate(90, 15)">
          <text x="0" y="14" font-family="'Outfit', sans-serif" font-size="10.5" font-weight="800" fill="#991b1b">MỤC LỤC (Gõ tay thủ công)</text>
          
          <text x="0" y="38" font-family="'Inter', sans-serif" font-size="7.5" font-weight="500" fill="#334155">1. Khởi động ....................... 2</text>
          <text x="0" y="54" font-family="'Inter', sans-serif" font-size="7.5" font-weight="500" fill="#334155">2. Ô nhiễm không khí .......... 3</text>
          <text x="0" y="70" font-family="'Inter', sans-serif" font-size="7.5" font-weight="500" fill="#334155">3. Nguồn nước ô nhiễm ................. 4</text>
          <text x="0" y="86" font-family="'Inter', sans-serif" font-size="7.5" font-weight="500" fill="#334155">4. Rác thải nhựa .............. 6</text>

          <rect x="0" y="105" width="235" height="58" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
          <text x="10" y="122" font-family="'Inter', sans-serif" font-size="8" font-weight="800" fill="#be123c">⚠️ HẬU QUẢ TAI HẠI:</text>
          <text x="10" y="136" font-family="'Inter', sans-serif" font-size="7.5" font-weight="500" fill="#9f1239">• Các con số lệch thụt thò, xấu xí.</text>
          <text x="10" y="148" font-family="'Inter', sans-serif" font-size="7.5" font-weight="500" fill="#9f1239">• Thêm 1 dòng ở trang 1 ➔ Phải sửa lại từng số!</text>
        </g>
      </g>

      <text x="182" y="285" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#e11d48" text-anchor="middle">Lỗi: Mất hàng giờ căn chỉnh tay, dễ nhầm lẫn số trang</text>
    </g>

    <!-- Right: After (Professional Automation) -->
    <g transform="translate(440, 20)">
      <rect width="365" height="30" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.2"/>
      <text x="182" y="19" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" fill="#065f46" text-anchor="middle">✓ AFTER: HEADING + TABLE OF CONTENTS TỰ ĐỘNG</text>

      <g transform="translate(15, 42)">
        <rect width="335" height="215" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>

        <!-- Left active outline -->
        <rect x="10" y="10" width="85" height="195" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
        <text x="52" y="26" font-family="'Inter', sans-serif" font-size="7.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">OUTLINE (H1, H2)</text>
        <g transform="translate(14, 38)">
          <text x="0" y="10" font-family="'Inter', sans-serif" font-size="7" font-weight="700" fill="#2563eb">• 1. Khởi động</text>
          <text x="0" y="24" font-family="'Inter', sans-serif" font-size="7" font-weight="700" fill="#2563eb">• 2. Thực trạng</text>
          <text x="6" y="38" font-family="'Inter', sans-serif" font-size="6.5" font-weight="500" fill="#475569">└ Không khí</text>
          <text x="6" y="50" font-family="'Inter', sans-serif" font-size="6.5" font-weight="500" fill="#475569">└ Nguồn nước</text>
          <text x="6" y="62" font-family="'Inter', sans-serif" font-size="6.5" font-weight="500" fill="#475569">└ Rác nhựa</text>
          <text x="0" y="76" font-family="'Inter', sans-serif" font-size="7" font-weight="700" fill="#2563eb">• 3. Giải pháp</text>
        </g>

        <!-- Right document area with neat TOC -->
        <g transform="translate(105, 15)">
          <text x="0" y="14" font-family="'Outfit', sans-serif" font-size="11" font-weight="900" fill="#0f172a">MỤC LỤC TỰ ĐỘNG</text>
          
          <text x="0" y="38" font-family="'Inter', sans-serif" font-size="7.5" font-weight="700" fill="#1e293b">1. Khởi động dự án</text>
          <line x1="85" y1="36" x2="200" y2="36" stroke="#94a3b8" stroke-width="1" stroke-dasharray="1.5 2.5"/>
          <text x="215" y="38" font-family="'Inter', sans-serif" font-size="8" font-weight="800" fill="#2563eb" text-anchor="end">2</text>

          <text x="0" y="54" font-family="'Inter', sans-serif" font-size="7.5" font-weight="700" fill="#1e293b">2. Thực trạng môi trường</text>
          <line x1="105" y1="52" x2="200" y2="52" stroke="#94a3b8" stroke-width="1" stroke-dasharray="1.5 2.5"/>
          <text x="215" y="54" font-family="'Inter', sans-serif" font-size="8" font-weight="800" fill="#2563eb" text-anchor="end">3</text>

          <text x="8" y="70" font-family="'Inter', sans-serif" font-size="7" font-weight="500" fill="#475569">2.1. Ô nhiễm không khí</text>
          <line x1="105" y1="68" x2="200" y2="68" stroke="#94a3b8" stroke-width="1" stroke-dasharray="1.5 2.5"/>
          <text x="215" y="70" font-family="'Inter', sans-serif" font-size="7.5" font-weight="700" fill="#2563eb" text-anchor="end">3</text>

          <text x="8" y="86" font-family="'Inter', sans-serif" font-size="7" font-weight="500" fill="#475569">2.2. Rác thải nhựa đại dương</text>
          <line x1="125" y1="84" x2="200" y2="84" stroke="#94a3b8" stroke-width="1" stroke-dasharray="1.5 2.5"/>
          <text x="215" y="86" font-family="'Inter', sans-serif" font-size="7.5" font-weight="700" fill="#2563eb" text-anchor="end">4</text>

          <rect x="0" y="105" width="220" height="58" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
          <text x="10" y="122" font-family="'Inter', sans-serif" font-size="8" font-weight="800" fill="#15803d">🌟 ƯU ĐIỂM VƯỢT TRỘI:</text>
          <text x="10" y="136" font-family="'Inter', sans-serif" font-size="7.5" font-weight="500" fill="#14532d">• Số trang thẳng hàng 100% tự động.</text>
          <text x="10" y="148" font-family="'Inter', sans-serif" font-size="7.5" font-weight="500" fill="#14532d">• Sửa trang ➔ Bấm nút 🔄 là tự nhảy số mới!</text>
        </g>
      </g>

      <text x="182" y="285" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" fill="#047857" text-anchor="middle">Đẳng cấp học thuật: Chuẩn báo cáo khoa học THCS &amp; Đại học</text>
    </g>
  </g>
</svg>
