<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230" role="img" aria-label="Minh họa mau-va-to-sang.svg"><rect width="760" height="230" rx="18" fill="#f1f6ff"/><text x="26" y="32" font-family="Arial" font-size="17" font-weight="700" fill="#153a73">Màu chữ thay nét chữ · Highlight thay nền sau chữ</text><rect x="28" y="52" width="330" height="149" rx="13" fill="white" stroke="#c9d9ef"/><text x="48" y="84" font-family="Arial" font-size="14" font-weight="700" fill="#2362c9">TEXT COLOR</text><text x="48" y="125" font-family="Arial" font-size="24" font-weight="700" fill="#2463ce">Thông báo quan trọng</text><text x="48" y="169" font-family="Arial" font-size="13" fill="#557092">Đổi màu nét chữ để tạo nhấn.</text><rect x="392" y="52" width="340" height="149" rx="13" fill="white" stroke="#c9d9ef"/><text x="412" y="84" font-family="Arial" font-size="14" font-weight="700" fill="#2362c9">HIGHLIGHT</text><rect x="410" y="101" width="285" height="34" rx="5" fill="#ffe486"/><text x="419" y="125" font-family="Arial" font-size="21" font-weight="700" fill="#253858">Nộp bài trước thứ Sáu</text><text x="412" y="169" font-family="Arial" font-size="13" fill="#557092">Tô nền ngắn, vẫn giữ chữ đậm dễ đọc.</text></svg>