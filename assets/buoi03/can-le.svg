<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230" role="img" aria-label="Minh họa can-le.svg"><rect width="760" height="230" rx="18" fill="#f1f6ff"/><text x="26" y="32" font-family="Arial" font-size="17" font-weight="700" fill="#153a73">Căn lề theo vai trò nội dung, không bằng nhiều dấu cách</text><rect x="26" y="52" width="218" height="150" rx="13" fill="white" stroke="#c9d9ef"/><text x="45" y="79" font-family="Arial" font-size="14" font-weight="700" fill="#2362c9">CĂN TRÁI</text><rect x="45" y="99" width="165" height="9" rx="4" fill="#427bdf"/><rect x="45" y="118" width="142" height="9" rx="4" fill="#a8bee5"/><rect x="45" y="137" width="156" height="9" rx="4" fill="#a8bee5"/><text x="45" y="178" font-family="Arial" font-size="13" fill="#557092">Thân bài, danh sách</text><rect x="271" y="52" width="218" height="150" rx="13" fill="white" stroke="#c9d9ef"/><text x="290" y="79" font-family="Arial" font-size="14" font-weight="700" fill="#2362c9">CĂN GIỮA</text><rect x="300" y="99" width="160" height="9" rx="4" fill="#427bdf"/><rect x="318" y="118" width="124" height="9" rx="4" fill="#a8bee5"/><rect x="307" y="137" width="146" height="9" rx="4" fill="#a8bee5"/><text x="290" y="178" font-family="Arial" font-size="13" fill="#557092">Tiêu đề ngắn</text><rect x="516" y="52" width="218" height="150" rx="13" fill="white" stroke="#c9d9ef"/><text x="535" y="79" font-family="Arial" font-size="14" font-weight="700" fill="#2362c9">CĂN PHẢI</text><rect x="555" y="99" width="160" height="9" rx="4" fill="#427bdf"/><rect x="573" y="118" width="142" height="9" rx="4" fill="#a8bee5"/><rect x="590" y="137" width="125" height="9" rx="4" fill="#a8bee5"/><text x="535" y="178" font-family="Arial" font-size="13" fill="#557092">Ngày tháng, ký tên</text></svg>