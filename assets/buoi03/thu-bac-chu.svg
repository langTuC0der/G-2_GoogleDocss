<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230" role="img" aria-label="Minh họa thu-bac-chu.svg"><rect width="760" height="230" rx="18" fill="#f1f6ff"/><text x="26" y="32" font-family="Arial" font-size="17" font-weight="700" fill="#153a73">Ba cấp chữ tạo đường đi cho mắt</text><rect x="28" y="49" width="704" height="155" rx="13" fill="white" stroke="#c9d9ef"/><text x="48" y="85" font-family="Arial" font-size="28" font-weight="700" fill="#2463ce">5 CÁCH HỌC TẬP HIỆU QUẢ</text><rect x="630" y="60" width="75" height="28" rx="14" fill="#e5efff"/><text x="644" y="80" font-family="Arial" font-size="13" font-weight="700" fill="#2463ce">20 pt</text><text x="48" y="125" font-family="Arial" font-size="19" font-weight="700" fill="#1d3558">Chuẩn bị bài trước khi đến lớp</text><rect x="630" y="103" width="75" height="26" rx="13" fill="#e5efff"/><text x="644" y="121" font-family="Arial" font-size="13" font-weight="700" fill="#2463ce">14 pt</text><text x="48" y="161" font-family="Arial" font-size="16" fill="#405372">Đọc trước bài mới và ghi lại những câu hỏi chưa rõ.</text><rect x="630" y="143" width="75" height="26" rx="13" fill="#e5efff"/><text x="644" y="161" font-family="Arial" font-size="13" font-weight="700" fill="#2463ce">11 pt</text><text x="48" y="188" font-family="Arial" font-size="12" fill="#6a7d98">Ví dụ cỡ chữ để quan sát sự chênh lệch; có thể điều chỉnh theo màn hình và mục đích.</text></svg>