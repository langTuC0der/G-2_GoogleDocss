<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-label="Hai phiên bản của cùng một nội dung: trước khó đọc, sau có tiêu đề và danh sách"><rect width="760" height="340" rx="20" fill="#143466"/><text x="28" y="38" font-family="Arial" font-size="17" font-weight="700" fill="#c9dbff">CÙNG NỘI DUNG · HAI CÁCH TRÌNH BÀY</text><rect x="29" y="59" width="309" height="247" rx="15" fill="#ffffff"/><rect x="422" y="59" width="309" height="247" rx="15" fill="#ffffff"/><text x="49" y="91" font-family="Arial" font-size="15" font-weight="700" fill="#bd5964">TRƯỚC</text><text x="442" y="91" font-family="Arial" font-size="15" font-weight="700" fill="#158a65">SAU</text><text x="49" y="127" font-family="Arial" font-size="17" fill="#3a4b69">5 cách học tập hiệu quả chuẩn</text><text x="49" y="151" font-family="Arial" font-size="17" fill="#3a4b69">bị bài trước khi đến lớp ghi</text><text x="49" y="175" font-family="Arial" font-size="17" fill="#3a4b69">chú các ý quan trọng ôn lại</text><text x="49" y="199" font-family="Arial" font-size="17" fill="#3a4b69">bài mỗi ngày hỏi khi chưa hiểu</text><text x="49" y="265" font-family="Arial" font-size="13" fill="#a45a62">Khó nhìn thấy ý chính</text><text x="442" y="128" font-family="Arial" font-size="19" font-weight="700" fill="#2866d6">5 CÁCH HỌC TẬP HIỆU QUẢ</text><path d="M442 140h255" stroke="#9cbdee"/><text x="445" y="176" font-family="Arial" font-size="17" fill="#2b4567">1. Chuẩn bị bài trước khi đến lớp</text><text x="445" y="207" font-family="Arial" font-size="17" fill="#2b4567">2. Ghi chú các ý quan trọng</text><text x="445" y="238" font-family="Arial" font-size="17" fill="#2b4567">3. Ôn lại bài mỗi ngày</text><text x="442" y="274" font-family="Arial" font-size="13" fill="#168862">Tiêu đề rõ · ý tách dòng · dễ quét</text><circle cx="380" cy="182" r="29" fill="#ffca45"/><path d="M367 182h26m-10-10 10 10-10 10" stroke="#143466" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>