<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230" role="img" aria-label="Minh họa chon-pham-vi.svg"><rect width="760" height="230" rx="18" fill="#f1f6ff"/><text x="26" y="32" font-family="Arial" font-size="17" font-weight="700" fill="#153a73">Chọn đúng phạm vi → công cụ mới tác động đúng chỗ</text><rect x="26" y="52" width="338" height="150" rx="13" fill="white" stroke="#c9d9ef"/><text x="46" y="82" font-family="Arial" font-size="14" font-weight="700" fill="#2362c9">1 · ĐỊNH DẠNG KÝ TỰ</text><text x="46" y="115" font-family="Arial" font-size="18" fill="#253858">Hôm nay em học</text><rect x="207" y="95" width="93" height="28" rx="5" fill="#ffdf7a"/><text x="211" y="115" font-family="Arial" font-size="18" font-weight="700" fill="#253858">Google</text><text x="46" y="164" font-family="Arial" font-size="13" fill="#557092">Bôi đen một từ → Bold / màu chữ</text><rect x="394" y="52" width="340" height="150" rx="13" fill="white" stroke="#c9d9ef"/><text x="414" y="82" font-family="Arial" font-size="14" font-weight="700" fill="#2362c9">2 · ĐỊNH DẠNG ĐOẠN</text><rect x="412" y="95" width="280" height="53" rx="7" fill="#e6efff" stroke="#2f6fea" stroke-dasharray="5 4"/><text x="429" y="118" font-family="Arial" font-size="16" fill="#253858">Hôm nay em học Google</text><text x="429" y="139" font-family="Arial" font-size="16" fill="#253858">Docs cùng cả lớp.</text><text x="414" y="177" font-family="Arial" font-size="13" fill="#557092">Đặt con trỏ trong đoạn → căn lề / giãn dòng</text></svg>